<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>aGemda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Manrope:wght@600;800&family=Instrument+Serif&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDnxTGzpS7umt2GJ2-WAX-qbqQEsKWFy_8"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    var missing = [];
    if (typeof React === "undefined") missing.push("React");
    if (typeof ReactDOM === "undefined") missing.push("ReactDOM");
    if (typeof Babel === "undefined") missing.push("Babel");
    if (typeof Sortable === "undefined") missing.push("Sortable");
    if (typeof google === "undefined" || !google.maps) missing.push("Google Maps");
    if (typeof supabase === "undefined") missing.push("Supabase");
    if (missing.length) {
      document.getElementById("root").innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:20px;">' +
        '<div><p>有幾個必要的程式庫沒有載入成功：<b>' + missing.join("、") + '</b></p>' +
        '<p style="color:#888;font-size:13px;">請確認網路連線正常，或改用 GitHub Pages 部署後開啟（部分瀏覽器對直接雙擊開啟的本機檔案限制較多）。</p></div></div>';
    }
  });
</script>
<style>
/* ==========================================================================
   aGemda — 介面樣式（電腦版）
   從設計稿 1a「清透」整理而成。只負責視覺，不改動功能與 DOM 語意。
   使用方式：載入 Manrope / Noto Sans TC / Instrument Serif 三套字體後引入本檔。
   <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Manrope:wght@600;800&family=Instrument+Serif&display=swap" rel="stylesheet">
   ========================================================================== */

:root {
  /* 底與面 */
  --ag-bg:            #eef0e4;  /* 頁面底 */
  --ag-surface:       #ffffff;  /* 卡片、待排清單 */
  --ag-surface-alt:   #f7f8f0;  /* 日欄底 */
  --ag-surface-sunk:  #e3e7d5;  /* 切換器底槽 */
  --ag-line:          #e2e6d6;  /* 卡片邊線 */
  --ag-line-soft:     #dde2cd;  /* 分隔線 */
  --ag-line-dash:     #d5dbc2;  /* 虛線分隔 */
  --ag-line-add:      #cdd4b8;  /* 新增按鈕虛線框 */

  /* 文字 */
  --ag-ink:           #2f3327;  /* 主要文字 */
  --ag-ink-2:         #4f5544;  /* 次要文字（4.5:1） */
  --ag-ink-3:         #6a7056;  /* 說明、計數（4.5:1） */
  --ag-ink-on-dark:   #eceadb;
  --ag-ink-on-dark-2: #a8ad95;

  /* 行為色 */
  --ag-accent:        #b0473d;  /* CTA、目前分頁、選取中 */
  --ag-accent-ink:    #ffffff;
  --ag-accent-hover:  #8d372f;

  /* 深色欄（目前選取日、地圖側欄） */
  --ag-dark:          #2f3327;
  --ag-dark-2:        #383d2f;  /* 深色欄裡的卡片 */
  --ag-dark-3:        #43483a;  /* 編輯中的卡片 */
  --ag-dark-line:     #4a4f3d;
  --ag-dark-dash:     #565b48;
  --ag-dark-time:     #f0b8ae;  /* 深色欄裡的時間 */

  /* 標記狀態（琥珀）：重點項目 */
  --ag-mark-bg:       #fdf4de;
  --ag-mark-line:     #e6c98c;
  --ag-mark-icon:     #c0a86f;
  --ag-mark-ink:      #6d6034;

  /* 寶石三色 —— 綠＝景點、黃＝餐飲、紅＝選取中 */
  --ag-gem-spot-body:  #4a7f6e;
  --ag-gem-spot-facet: #6da795;
  --ag-gem-spot-shine: #9ecabd;
  --ag-gem-spot-ring:  #2e5d4f;
  --ag-gem-spot-g:     #4a8f78;   /* 字標大寫 G */

  --ag-gem-food-body:  #c98a1e;
  --ag-gem-food-facet: #e2ab43;
  --ag-gem-food-shine: #f4d488;
  --ag-gem-food-ring:  #8a5f12;
  --ag-gem-food-g:     #c08313;

  --ag-gem-sel-body:   #b0473d;
  --ag-gem-sel-facet:  #d4796d;
  --ag-gem-sel-shine:  #e8a79c;
  --ag-gem-sel-ring:   #7e2f28;
  --ag-gem-sel-g:      #c25a4e;

  /* 字體 */
  --ag-font-ui:    "Noto Sans TC", system-ui, sans-serif;
  --ag-font-brand: "Manrope", sans-serif;   /* 只用於字標 */
  --ag-font-num:   "Fraunces", "Instrument Serif", serif; /* 日期、時間 —— 沿用 v1 字體 */

  /* 圓角與陰影 */
  --ag-r-panel: 20px;
  --ag-r-card:  16px;
  --ag-r-item:  12px;
  --ag-r-pill:  999px;
  --ag-shadow-pop: 0 18px 40px rgba(47, 51, 39, .14);
  --ag-shadow-tab: 0 1px 2px rgba(47, 51, 39, .08);

  /* 選取中日期列強調色 —— 與地圖同一個墨綠 var(--ag-dark) */

  /* 完成勾選：淺綠外框／實心綠 */
  --ag-check-empty: #a7d6b6;
  --ag-check-done:  #3f8f5c;

  /* 卡片序號紅圈（與地圖圖釘同色） */
  --ag-badge-bg:  #c1524a;
  --ag-badge-ink: #ffffff;
}

/* --------------------------------------------------------------------------
   基礎
   -------------------------------------------------------------------------- */

body {
  margin: 0;
  background: var(--ag-bg);
  color: var(--ag-ink);
  font-family: var(--ag-font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--ag-accent); }
a:hover { color: var(--ag-accent-hover); }

.ag-app { max-width: 1680px; margin: 0 auto; }

/* --------------------------------------------------------------------------
   字標
   HTML：
   <span class="ag-logo">
     <span class="ag-gem ag-gem--26 ag-gem--spot">
       <i class="ag-gem__ring"></i>
       <i class="ag-gem__body"></i>
       <i class="ag-gem__facet"></i>
       <i class="ag-gem__shine"></i>
       <i class="ag-gem__ring ag-gem__ring--front"></i>
     </span>
     <span class="ag-logo__word">a<em>G</em>emda</span>
   </span>
   -------------------------------------------------------------------------- */

.ag-logo { display: flex; align-items: center; gap: 13px; }

.ag-logo__word {
  font-family: var(--ag-font-brand);
  font-weight: 800;
  font-size: 34px;
  letter-spacing: .01em;
  line-height: 1;
  color: var(--ag-ink);
}
.ag-logo__word em { font-style: normal; color: var(--ag-gem-spot-g); }
.ag-logo--food .ag-logo__word em { color: var(--ag-gem-food-g); }
.ag-logo--sel  .ag-logo__word em { color: var(--ag-gem-sel-g); }

/* 字標尺寸：42px 記號搭 46px 字、26px 記號搭 34px 字、18px 記號搭 16px 字 */
.ag-logo--lg .ag-logo__word { font-size: 46px; }
.ag-logo--sm { gap: 9px; }
.ag-logo--sm .ag-logo__word { font-size: 16px; }

/* --------------------------------------------------------------------------
   寶石記號（字標、地圖圖釘、項目序號共用）
   立體感的關鍵：地面環畫兩次，後緣在寶石之下、前緣用 inset(50% 0 0 0)
   壓在寶石之上，寶石尖端因此坐進圈中心而不是黏在旁邊。
   -------------------------------------------------------------------------- */

.ag-gem { position: relative; display: inline-block; flex: 0 0 auto; }

.ag-gem__body,
.ag-gem__facet,
.ag-gem__shine,
.ag-gem__ring { position: absolute; display: block; box-sizing: border-box; }

.ag-gem__body  { clip-path: polygon(50% 0%, 100% 34%, 50% 100%, 0% 34%); }
.ag-gem__facet { clip-path: polygon(0% 34%, 50% 0%, 100% 34%, 50% 52%); }
.ag-gem__shine { clip-path: polygon(50% 0%, 76% 17%, 50% 34%, 24% 17%); }
.ag-gem__ring  { border-radius: 50%; border-style: solid; }
.ag-gem__ring--front { clip-path: inset(50% 0 0 0); }

/* 尺寸 —— 42px（大字標） */
.ag-gem--42 { width: 44px; height: 50px; }
.ag-gem--42 .ag-gem__body,
.ag-gem--42 .ag-gem__facet,
.ag-gem--42 .ag-gem__shine { left: 1px; top: 0; width: 42px; height: 42px; }
.ag-gem--42 .ag-gem__ring { left: 5px; top: 33px; width: 34px; height: 13px; border-width: 2.2px; }

/* 尺寸 —— 26px（標頭、地圖圖釘） */
.ag-gem--26 { width: 28px; height: 32px; }
.ag-gem--26 .ag-gem__body,
.ag-gem--26 .ag-gem__facet,
.ag-gem--26 .ag-gem__shine { left: 1px; top: 0; width: 26px; height: 26px; }
.ag-gem--26 .ag-gem__ring { left: 3px; top: 21px; width: 22px; height: 9px; border-width: 1.7px; }

/* 尺寸 —— 18px（項目序號） */
.ag-gem--18 { width: 20px; height: 24px; }
.ag-gem--18 .ag-gem__body,
.ag-gem--18 .ag-gem__facet,
.ag-gem--18 .ag-gem__shine { left: 1px; top: 0; width: 18px; height: 18px; }
.ag-gem--18 .ag-gem__ring { left: 2px; top: 15px; width: 16px; height: 7px; border-width: 1.4px; }
.ag-gem--18 .ag-gem__shine { display: none; } /* 太小，亮面會糊掉 */

/* 配色 */
.ag-gem--spot .ag-gem__body  { background: var(--ag-gem-spot-body); }
.ag-gem--spot .ag-gem__facet { background: var(--ag-gem-spot-facet); }
.ag-gem--spot .ag-gem__shine { background: var(--ag-gem-spot-shine); }
.ag-gem--spot .ag-gem__ring  { border-color: var(--ag-gem-spot-ring); }

.ag-gem--food .ag-gem__body  { background: var(--ag-gem-food-body); }
.ag-gem--food .ag-gem__facet { background: var(--ag-gem-food-facet); }
.ag-gem--food .ag-gem__shine { background: var(--ag-gem-food-shine); }
.ag-gem--food .ag-gem__ring  { border-color: var(--ag-gem-food-ring); }

.ag-gem--sel .ag-gem__body  { background: var(--ag-gem-sel-body); }
.ag-gem--sel .ag-gem__facet { background: var(--ag-gem-sel-facet); }
.ag-gem--sel .ag-gem__shine { background: var(--ag-gem-sel-shine); }
.ag-gem--sel .ag-gem__ring  { border-color: var(--ag-gem-sel-ring); }

/* 地圖上的圖釘：以尖端為定位點 */
.ag-pin { position: absolute; transform: translate(-50%, -100%); }

/* --------------------------------------------------------------------------
   外框與標頭
   -------------------------------------------------------------------------- */

.ag-shell {
  background: var(--ag-bg);
  border: 1px solid #d7ddc6;
  border-radius: var(--ag-r-panel);
  overflow: hidden;
}
.ag-shell--mobile {
  border: none;
  border-radius: 0;
  overflow: visible;
}

.ag-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  padding: 30px 36px 22px;
}
.ag-header__left { display: flex; flex-direction: column; gap: 8px; }
.ag-header__title { display: flex; align-items: center; gap: 16px; }

/* 手機版標頭：logo 靠左，其餘控制項維持小尺寸、自然寬度，不要撐滿一整排 */
.ag-header--mobile {
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  max-width: 380px;
  margin: 0 auto;
  padding: 16px 14px 14px;
}
.ag-header--mobile .ag-header__title { justify-content: flex-start; }
.ag-header--mobile .ag-header__tools { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 8px; }
.ag-header--mobile .ag-backfill-btn { padding: 7px 9px; }
.ag-header--mobile .ag-toggle button { padding: 5px 10px; font-size: 12px; }

.ag-header__tools { display: flex; gap: 10px; align-items: center; }

/* 補齊座標／翻譯 —— 獨立小按鈕 */
.ag-backfill-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--ag-line-soft);
  border-radius: var(--ag-r-pill);
  background: var(--ag-surface);
  padding: 6px 13px;
  font: inherit; font-size: 12.5px;
  color: var(--ag-ink-2);
  cursor: pointer;
}
.ag-backfill-btn:hover { border-color: var(--ag-accent); color: var(--ag-accent); }
.ag-backfill-btn svg { width: 13px; height: 13px; }
.ag-backfill-status { font-size: 12px; color: var(--ag-ink-3); }
@keyframes ag-spin { to { transform: rotate(360deg); } }
.ag-spin { animation: ag-spin 1s linear infinite; }

/* 手機版：語言／檢視模式切換改成單一圖示按鈕，不佔版面 */
.ag-icon-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; flex: 0 0 auto;
  border: 1px solid var(--ag-line-soft);
  border-radius: 50%;
  background: var(--ag-surface);
  color: var(--ag-ink-2);
  cursor: pointer;
}
.ag-icon-toggle:hover { border-color: var(--ag-accent); color: var(--ag-accent); }
.ag-icon-toggle svg { width: 14px; height: 14px; }

/* 旅遊日期列 —— 獨立一排，位在分頁（行程／航班・飯店／購物清單）之外，
   三個分頁都能用它改旅遊時間 */
.ag-triprow {
  display: flex; align-items: center; gap: 10px;
  padding: 0 36px 16px;
}
.ag-triprow--mobile { max-width: 380px; margin: 0 auto; padding: 0 14px 14px; flex-wrap: wrap; }
.ag-triprow__label { font-size: 13.5px; color: var(--ag-ink-2); }
.ag-triprow__range {
  font-family: var(--ag-font-num);
  font-size: 24px;
  letter-spacing: .01em;
  color: var(--ag-ink);
}
.ag-triprow__edit {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px;
  border: 1px solid var(--ag-line-soft);
  border-radius: 50%;
  background: var(--ag-surface);
  color: var(--ag-ink-3);
  cursor: pointer;
}
.ag-triprow__edit:hover { border-color: var(--ag-accent); color: var(--ag-accent); }
.ag-triprow__edit svg { width: 12px; height: 12px; }

/* 分段切換（中文 / EN、電腦版 / 手機版） */
.ag-toggle {
  display: flex;
  gap: 0;
  background: var(--ag-surface-sunk);
  border: 1px solid #d3dabf;
  border-radius: 10px;
  padding: 3px;
}
.ag-toggle button {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border: 0; border-radius: 7px;
  background: transparent;
  font: inherit; font-size: 13px;
  color: var(--ag-ink-2);
  cursor: pointer;
}
.ag-toggle button:hover { color: var(--ag-ink); }
.ag-toggle button[aria-pressed="true"],
.ag-toggle button.is-on {
  background: var(--ag-surface);
  color: var(--ag-ink);
  font-weight: 700;
  box-shadow: var(--ag-shadow-tab);
}
.ag-toggle svg { width: 14px; height: 14px; }

/* 主分頁（行程 / 航班·飯店 / 購物清單） */
.ag-tabs {
  display: flex;
  gap: 8px;
  padding: 0 36px 20px;
  border-bottom: 1px solid var(--ag-line-soft);
}
.ag-tabs--mobile {
  max-width: 352px;
  margin: 0 auto 16px;
  padding: 3px;
  gap: 0;
  background: var(--ag-surface-sunk);
  border: 1px solid #d3dabf;
  border-bottom: 1px solid #d3dabf;
  border-radius: 10px;
}
.ag-tabs--mobile .ag-tab {
  flex: 1; justify-content: center;
  padding: 8px 6px;
  font-size: 12.5px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--ag-ink-2);
}
.ag-tabs--mobile .ag-tab:hover { border-color: transparent; }
.ag-tabs--mobile .ag-tab.is-active { box-shadow: none; }
.ag-tab {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 20px;
  border: 1px solid var(--ag-line-soft);
  border-radius: var(--ag-r-pill);
  background: var(--ag-surface);
  font: inherit; font-size: 14px;
  color: #4d5340;
  cursor: pointer;
}
.ag-tab:hover { border-color: var(--ag-ink-3); color: var(--ag-ink); }
.ag-tab[aria-selected="true"],
.ag-tab.is-active {
  background: var(--ag-accent);
  border-color: var(--ag-accent);
  color: var(--ag-accent-ink);
  font-weight: 700;
}
.ag-tab svg { width: 15px; height: 15px; }

/* --------------------------------------------------------------------------
   主體：行程區 ＋ 右側地圖
   -------------------------------------------------------------------------- */

.ag-body { display: flex; align-items: stretch; }
.ag-main { flex: 1; min-width: 0; padding: 0 0 28px 36px; }

/* 右側地圖欄：收合時是細長頁籤，展開時把日期卡片往左推（不浮在畫面上） */
.ag-maprail { flex: 0 0 44px; display: flex; align-items: flex-start; padding-top: 34px; }
.ag-maprail--open { flex: 0 0 470px; align-items: stretch; padding: 24px 36px 28px 0; }
.ag-maprail__tab {
  width: 32px;
  padding: 16px 0;
  background: var(--ag-dark);
  color: #f0efe1;
  border: 0;
  border-radius: 10px 0 0 10px;
  font: inherit; font-size: 13px;
  letter-spacing: .12em;
  writing-mode: vertical-rl;
  text-align: center;
  cursor: pointer;
}

/* --------------------------------------------------------------------------
   待排清單
   -------------------------------------------------------------------------- */

.ag-backlog {
  background: var(--ag-surface-alt);
  border: 1px solid var(--ag-line);
  border-radius: var(--ag-r-card);
  padding: 20px 22px 18px;
  margin: 24px 36px 0;
}
.ag-backlog__head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.ag-backlog__title { font-size: 15px; font-weight: 700; }
.ag-backlog__note,
.ag-backlog__count { font-size: 12.5px; color: var(--ag-ink-3); }
.ag-backlog__count { margin-left: auto; font-size: 12px; }
/* 保留左右滑動，但不顯示拉霸 */
.ag-backlog__track {
  display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.ag-backlog__track::-webkit-scrollbar { display: none; }
.ag-backlog__track > * { flex: 0 0 186px; }

/* --------------------------------------------------------------------------
   日欄
   -------------------------------------------------------------------------- */

.ag-days { display: flex; gap: 16px; margin-top: 26px; overflow-x: auto; padding-bottom: 10px; }

.ag-day {
  flex: 0 0 218px;
  overflow: hidden;
  background: var(--ag-surface-alt);
  border: 1px solid var(--ag-line);
  border-radius: var(--ag-r-card);
  padding: 18px 16px 16px;
}
.ag-day__head {
  display: flex; align-items: baseline; gap: 9px;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--ag-line-dash);
}
.ag-day__date { font-family: var(--ag-font-num); font-size: 27px; line-height: 1; }
.ag-day__wd { font-size: 13px; color: var(--ag-ink-3); }
.ag-day__count { margin-left: auto; font-size: 12px; color: var(--ag-ink-3); }
.ag-day__list { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
.ag-day__foot {
  display: flex; gap: 7px;
  margin-top: 14px; padding-top: 12px;
  border-top: 1px dashed var(--ag-line-dash);
  font-size: 12.5px; color: var(--ag-ink-3); line-height: 1.5;
}
.ag-day__foot svg { flex: 0 0 auto; margin-top: 2px; width: 14px; height: 14px; }

/* 目前選取日（與地圖對應）＝日期列＋卡片外面那層底色都變墨綠（跟地圖同色），
   卡片本身不受影響（ag-item 有自己的白底，不會被連動變色） */
.ag-day--active {
  background: var(--ag-dark);
  border-color: var(--ag-dark);
}
.ag-day--active .ag-day__head { border-bottom-color: var(--ag-dark-dash); }
.ag-day--active .ag-day__date,
.ag-day--active .ag-day__wd,
.ag-day--active .ag-day__count { color: var(--ag-ink-on-dark); }
.ag-day--active .ag-day__foot { color: var(--ag-ink-on-dark-2); border-top-color: var(--ag-dark-dash); }
.ag-day--active .ag-add { border-color: #575c49; color: #b6bba2; }

/* --------------------------------------------------------------------------
   項目卡
   HTML：
   <article class="ag-item">
     <header class="ag-item__bar">
       <span class="ag-item__grip">…</span>
       <span class="ag-gem ag-gem--18 ag-gem--spot">…</span>
       <span class="ag-item__badge">1</span>
       <button class="ag-item__check">…</button>
       <span class="ag-item__acts">…</span>
     </header>
     <h4 class="ag-item__title">…</h4>
     <p class="ag-item__sub">…</p>
   </article>
   -------------------------------------------------------------------------- */

.ag-item {
  background: var(--ag-surface);
  border: 1px solid #e4e8d8;
  border-radius: var(--ag-r-item);
  padding: 11px 12px;
}
.ag-item__bar { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
.ag-item__grip { color: #c9cfb6; cursor: grab; }

/* 項目序號：與地圖圖釘同款的紅色圓形 */
.ag-item__badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; flex: 0 0 auto;
  border-radius: 50%;
  background: var(--ag-badge-bg);
  color: var(--ag-badge-ink);
  font-family: var(--ag-font-brand);
  font-size: 10.5px; font-weight: 800;
}
/* 時間文字（沿用原本的數字字體） */
.ag-item__time {
  font-family: var(--ag-font-num);
  font-size: 14px;
  color: var(--ag-ink-2);
}
.ag-item__title { margin: 0; font-size: 14.5px; font-weight: 700; line-height: 1.4; text-wrap: pretty; }
.ag-item__sub { margin: 3px 0 0; font-size: 12.5px; color: var(--ag-ink-3); line-height: 1.5; }

/* 卡上的圖示按鈕：低對比，hover 才跳出來 */
.ag-item__acts { margin-left: auto; display: flex; gap: 8px; }
.ag-item__acts button {
  border: 0; padding: 0; background: none; cursor: pointer;
  color: #b9c0a3;
  display: inline-flex;
}
.ag-item__acts button:hover { color: var(--ag-ink-2); }
.ag-item svg { width: 14px; height: 14px; }

/* 完成勾選 —— 沿用 v1 的 toggle-badge 做法：圓形按鈕＋固定顯示的勾勾圖示，
   用邊框/底色切換未完成（淺綠外框）／已完成（實心綘） */
.ag-item__check {
  width: 17px; height: 17px; flex: 0 0 auto;
  border-radius: 50%;
  border: 1.5px solid var(--ag-check-empty);
  color: var(--ag-check-empty);
  background: none; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.ag-item__check svg { width: 11px; height: 11px; }
.ag-item__check:hover { border-color: var(--ag-check-done); color: var(--ag-check-done); }
.ag-item__check.is-done { border-color: var(--ag-check-done); background: var(--ag-check-done); color: #fff; }

/* 標記中的項目（琥珀） */
.ag-item--mark {
  background: var(--ag-mark-bg);
  border-color: var(--ag-mark-line);
}
.ag-item--mark .ag-item__sub { color: var(--ag-mark-ink); }
.ag-item--mark .ag-item__time { color: var(--ag-mark-ink); }
.ag-item--mark .ag-item__grip { color: #cfc09a; }
.ag-item--mark .ag-item__acts button { color: var(--ag-mark-icon); }
.ag-item--mark .ag-item__check { border-color: var(--ag-check-empty); color: var(--ag-check-empty); }
.ag-item--mark .ag-item__check.is-done { background: var(--ag-check-done); border-color: var(--ag-check-done); color: #fff; }

.ag-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--ag-dark-line);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 11.5px;
  color: #dfe0cd;
}
.ag-time { font-family: var(--ag-font-num); font-size: 17px; color: var(--ag-dark-time); }

/* 編輯中的卡片（輸入狀態） */
.ag-item--editing {
  background: var(--ag-dark-3);
  border: 1.5px solid #d98f84;
}
.ag-field {
  width: 100%;
  background: var(--ag-dark);
  border: 1px solid #5a5f4b;
  border-radius: 8px;
  padding: 7px 10px;
  font: inherit; font-size: 13px;
  color: var(--ag-ink-on-dark);
  box-sizing: border-box;
}
.ag-field::placeholder { color: var(--ag-ink-on-dark-2); }
.ag-field--title { font-size: 13.5px; font-weight: 700; }
.ag-field-row { display: flex; gap: 8px; margin-bottom: 9px; }
.ag-field-row .ag-field { flex: 1; }
.ag-confirm {
  width: 38px; border: 0; border-radius: 8px;
  background: var(--ag-accent);
  color: var(--ag-accent-ink);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}

/* 新增按鈕（虛線） */
.ag-addrow { display: flex; gap: 8px; }
.ag-add {
  flex: 1;
  border: 1px dashed var(--ag-line-add);
  border-radius: 10px;
  padding: 9px;
  background: none;
  font: inherit; font-size: 13px;
  color: var(--ag-ink-3);
  text-align: center;
  cursor: pointer;
}
.ag-add:hover { border-color: var(--ag-ink-3); color: var(--ag-ink-2); }
.ag-add--wide { flex: 0 0 150px; border-radius: var(--ag-r-item); }

/* --------------------------------------------------------------------------
   地圖面板（展開）
   -------------------------------------------------------------------------- */

.ag-map {
  width: 100%;
  display: flex;
  flex-direction: column;
  background: var(--ag-dark);
  border: 1px solid var(--ag-dark);
  border-radius: 18px;
  padding: 18px;
  box-sizing: border-box;
  color: var(--ag-ink-on-dark);
}
.ag-map__head {
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--ag-dark-dash);
}
.ag-map__date { font-family: var(--ag-font-num); font-size: 25px; color: var(--ag-ink-on-dark); }
.ag-map__wd,
.ag-map__count { font-size: 13px; color: var(--ag-ink-on-dark-2); }
.ag-map__count { font-size: 12.5px; }
.ag-map__close { border: 0; background: none; cursor: pointer; color: var(--ag-ink-on-dark-2); display: inline-flex; }
.ag-map__close:hover { color: var(--ag-ink-on-dark); }
.ag-map__canvas {
  position: relative;
  flex: 1;
  min-height: 320px;
  margin-top: 14px;
  border-radius: 14px;
  overflow: hidden;
  background: #eceada;
}
.ag-map__hint { margin-top: 12px; text-align: center; font-size: 12.5px; color: var(--ag-ink-on-dark-2); flex: 0 0 auto; }

/* --------------------------------------------------------------------------
   捲軸
   -------------------------------------------------------------------------- */

.ag-days::-webkit-scrollbar { height: 8px; }
.ag-days::-webkit-scrollbar-thumb { background: #c3cbb0; border-radius: 8px; }
.ag-days::-webkit-scrollbar-track { background: transparent; }


/* ============ 航班・飯店 / 購物清單 / 手機版（架構、間距沿用 v1，線條與視覺細節統一成電腦版語彙） ============ */
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { font-family: var(--ag-font-ui); }

.logi-section { display: flex; flex-direction: column; gap: 14px; }
.logi-group-label { font-family: var(--ag-font-num); font-size: 15px; font-weight: 600; color: var(--ag-ink); margin-bottom: 2px; }
.logi-list { display: flex; flex-direction: column; gap: 9px; max-width: 440px; }
.logi-card { display: flex; gap: 10px; background: var(--ag-surface); border: 1px solid var(--ag-line); border-radius: var(--ag-r-item); padding: 10px 12px; align-items: flex-start; }
.logi-card.editing { flex-direction: column; align-items: stretch; border-color: var(--ag-accent); }
.logi-icon { width: 30px; height: 30px; border-radius: var(--ag-r-item); background: var(--ag-surface-sunk); display: flex; align-items: center; justify-content: center; color: var(--ag-ink); flex: none; }
.logi-main { flex: 1; min-width: 0; }
.logi-top-row { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.logi-date { font-family: var(--ag-font-num); font-size: 13px; color: var(--ag-accent); }
.logi-tag { font-size: 10.5px; background: var(--ag-surface-sunk); color: var(--ag-ink-2); padding: 1px 6px; border-radius: 6px; }
.logi-title { font-size: 14px; font-weight: 600; }
.logi-sub { font-size: 12px; color: var(--ag-ink-3); margin-top: 1px; }
.logi-actions { display: flex; gap: 2px; flex: none; }
.logi-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
.logi-edit-grid input, .logi-note-input { border: 1px solid var(--ag-line); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; font-family: var(--ag-font-ui); margin-bottom: 6px; width: 100%; }
.logi-save { justify-content: center; background: var(--ag-accent); color: var(--ag-accent-ink); padding: 7px; border-radius: 8px; }
.logi-save:hover { background: var(--ag-accent-hover); color: var(--ag-accent-ink); }
.logi-add { display: flex; align-items: center; gap: 5px; border: 1px dashed var(--ag-line-add); background: transparent; color: var(--ag-ink-3); font-size: 12.5px; padding: 8px; border-radius: var(--ag-r-item); cursor: pointer; justify-content: center; }
.logi-add:hover { border-color: var(--ag-ink-3); color: var(--ag-ink-2); }
.icon-btn { border: none; background: transparent; color: var(--ag-ink-3); cursor: pointer; padding: 2px; display: flex; align-items: center; gap: 4px; border-radius: 4px; }
.icon-btn:hover { color: var(--ag-ink-2); }
.edit-btn { }
.edit-btn:hover { color: var(--ag-accent); }
.map-btn:hover { color: var(--ag-accent); }
.del-btn:hover { color: var(--ag-accent-hover); }

.shop-section { max-width: 420px; }
.shop-progress { font-size: 12px; color: var(--ag-ink-3); margin-bottom: 10px; }
.shop-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.shop-row { display: flex; align-items: center; gap: 9px; background: var(--ag-surface); border: 1px solid var(--ag-line); border-radius: var(--ag-r-item); padding: 8px 10px; }
.shop-check { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--ag-check-empty); background: transparent; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; flex: none; }
.shop-check.checked { background: var(--ag-check-done); border-color: var(--ag-check-done); }
.shop-text { flex: 1; font-size: 13.5px; }
.shop-text.checked { text-decoration: line-through; color: var(--ag-ink-3); }

/* 手機版與待排清單卡片仍使用的 v1 卡片架構，視覺細節已對齊電腦版 */
.card { background: var(--ag-surface); border: 1px solid var(--ag-line); border-radius: var(--ag-r-item); padding: 8px 9px 9px; cursor: pointer; }
.card:active { cursor: grabbing; }
.card.important { background: var(--ag-mark-bg); border-color: var(--ag-mark-line); }
.card.editing { cursor: default; border-color: var(--ag-accent); }
.card.auto { background: var(--ag-surface-alt); border: 1.5px dashed var(--ag-line-dash); cursor: default; }
.card.transit { border-style: dashed; border-color: var(--ag-line-dash); background: var(--ag-surface); }
.card-kind-tag { display: flex; align-items: center; gap: 3px; font-size: 9.5px; background: var(--ag-surface-sunk); color: var(--ag-ink-2); padding: 2px 6px; border-radius: 6px; }
.card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.card-acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.grip { color: #c9cfb6; padding: 8px; margin: -8px; }
.transit-icon { color: var(--ag-gem-spot-body); flex: none; }
.card-time { font-family: var(--ag-font-num); font-size: 13px; color: var(--ag-ink-2); background: none; padding: 0; border-radius: 0; }
.map-index-badge { width: 18px; height: 18px; border-radius: 50%; background: var(--ag-badge-bg); color: var(--ag-badge-ink); font-family: var(--ag-font-brand); font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; }
.toggle-badge { width: 17px; height: 17px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.book-badge { border: 1.5px solid var(--ag-check-empty); color: var(--ag-check-empty); }
.book-badge.on { border-color: var(--ag-check-done); background: var(--ag-check-done); color: #fff; }
.card-name { font-size: 13.5px; font-weight: 700; line-height: 1.35; }
.card-note { font-size: 11.5px; color: var(--ag-ink-3); margin-top: 2px; }
.night-strip { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ag-ink-2); padding-top: 6px; margin-top: 2px; border-top: 1px dashed var(--ag-line-dash); cursor: pointer; }
.night-strip:hover { color: var(--ag-ink); }
.edit-row { display: flex; gap: 6px; margin-bottom: 6px; }
.edit-time { width: 70px; border: 1px solid var(--ag-accent); border-radius: 8px; padding: 5px 7px; font-size: 12.5px; font-family: var(--ag-font-ui); }
.edit-name { width: 100%; border: 1px solid var(--ag-accent); border-radius: 8px; padding: 5px 7px; font-size: 13px; font-weight: 700; font-family: var(--ag-font-ui); margin-bottom: 6px; box-sizing: border-box; }
.edit-note { width: 100%; border: 1px solid var(--ag-line); border-radius: 8px; padding: 5px 7px; font-size: 12px; font-family: var(--ag-font-ui); box-sizing: border-box; }
.save-btn { margin-left: auto; background: var(--ag-accent); color: var(--ag-accent-ink); border-radius: 8px; padding: 4px 6px; }
.add-row { display: flex; align-items: center; gap: 5px; border: 1px dashed var(--ag-line-add); background: transparent; color: var(--ag-ink-3); font-size: 12px; padding: 7px; border-radius: var(--ag-r-item); cursor: pointer; justify-content: center; }
.add-row:hover { border-color: var(--ag-ink-3); color: var(--ag-ink-2); }
.add-form input { width: 100%; border: 1px solid var(--ag-accent); border-radius: var(--ag-r-item); padding: 7px 8px; font-size: 12.5px; font-family: var(--ag-font-ui); }

.mobile-wrap { max-width: 380px; margin: 0 auto; padding: 0 14px; }

/* 待排清單（手機版）—— 跟電腦版一樣：淺綠底、卡片白色、可滑動但不顯示拉霸 */
.inbox-shelf { max-width: 352px; margin: 20px auto 20px; background: var(--ag-surface-alt); border: 1px solid var(--ag-line); border-radius: var(--ag-r-card); padding: 14px 14px 12px; }
.inbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ag-ink); margin-bottom: 10px; }
.inbox-empty { font-size: 12px; color: var(--ag-ink-3); }
.inbox-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -ms-overflow-style: none; }
.inbox-row::-webkit-scrollbar { display: none; }
.inbox-card-wrap { flex: 0 0 190px; }

.day-tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; scroll-snap-type: x mandatory; scrollbar-width: none; -ms-overflow-style: none; }
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab { flex: 0 0 auto; border: 1px solid var(--ag-line); background: var(--ag-surface); border-radius: var(--ag-r-item); padding: 6px 10px; text-align: center; cursor: pointer; font-family: var(--ag-font-num); scroll-snap-align: start; }
.day-tab.active { background: var(--ag-dark); border-color: var(--ag-dark); }
.day-tab .md { font-size: 14px; font-weight: 600; color: var(--ag-ink); }
.day-tab.active .md { color: var(--ag-ink-on-dark); }
.day-tab .wd { font-size: 9.5px; color: var(--ag-ink-3); font-family: var(--ag-font-ui); }
.day-tab.active .wd { color: var(--ag-ink-on-dark-2); }
.mobile-list { display: flex; flex-direction: column; gap: 9px; padding-bottom: 76px; }
.empty-note { font-size: 12px; color: var(--ag-ink-3); padding: 8px 2px 12px; }
.mobile-map-fab { position: fixed; right: 16px; bottom: 16px; width: 52px; height: 52px; border-radius: 50%; background: var(--ag-dark); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(47,51,39,0.35); z-index: 30; border: none; cursor: pointer; }
.mobile-map-overlay { position: fixed; inset: 0; background: var(--ag-bg); z-index: 100; display: flex; flex-direction: column; }
.mobile-map-close { position: absolute; top: 14px; left: 14px; width: 36px; height: 36px; border-radius: 50%; background: rgba(47,51,39,0.75); color: var(--ag-ink-on-dark); display: flex; align-items: center; justify-content: center; z-index: 5; border: none; cursor: pointer; }
.mobile-map-canvas-wrap { flex: 1; min-height: 0; }
.mobile-map-canvas-wrap .map-canvas-el { height: 100%; border-radius: 0; min-height: 0; }
.mobile-map-bottom { background: var(--ag-surface); border-top: 1px solid var(--ag-line); padding: 10px 12px 16px; }
.mobile-map-days { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 8px; }
.mobile-map-days::-webkit-scrollbar { display: none; }
.mobile-map-mini-list { display: flex; gap: 8px; overflow-x: auto; }
.mobile-map-mini-list::-webkit-scrollbar { display: none; }
.mobile-map-mini-card { flex: 0 0 auto; background: var(--ag-surface); border: 1px solid var(--ag-line); border-radius: var(--ag-r-item); padding: 8px 10px; display: flex; align-items: center; gap: 8px; cursor: pointer; max-width: 220px; }
.mobile-map-mini-num { width: 18px; height: 18px; border-radius: 50%; background: var(--ag-badge-bg); color: var(--ag-badge-ink); font-family: var(--ag-font-brand); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; }
.mobile-map-mini-name { font-size: 12.5px; color: var(--ag-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mobile-map-mini-time { font-size: 10.5px; color: var(--ag-ink-3); flex: none; }
.mobile-map-empty { font-size: 12px; color: var(--ag-ink-3); padding: 6px 2px; }

.setup-panel { background: var(--ag-surface-alt); border: 1px solid var(--ag-line); border-radius: var(--ag-r-item); padding: 12px 14px; margin: 0 36px 16px; display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.setup-panel--mobile { max-width: 380px; margin: 0 auto 16px; }
.setup-field { display: flex; flex-direction: column; gap: 4px; }
.setup-field label { font-size: 11px; color: var(--ag-ink-3); }
.setup-field input { border: 1px solid var(--ag-line); border-radius: 8px; padding: 6px 8px; font-family: var(--ag-font-ui); font-size: 12.5px; }
.setup-close { margin-left: auto; border: none; background: var(--ag-dark); color: var(--ag-ink-on-dark); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; }

/* 旅程切換列 */
.ag-tripbar { display: flex; align-items: center; gap: 10px; padding: 0 36px 14px; }
.ag-tripbar--mobile { max-width: 380px; margin: 0 auto; padding: 0 14px 12px; }
.ag-tripselect {
  flex: 1 1 auto; min-width: 0; max-width: 340px;
  border: 1px solid var(--ag-line-soft); border-radius: var(--ag-r-pill);
  background: var(--ag-surface); color: var(--ag-ink);
  padding: 7px 14px; font: inherit; font-size: 13.5px; cursor: pointer;
}
.setup-field input[type="text"] { border: 1px solid var(--ag-line); border-radius: 8px; padding: 6px 8px; font-family: var(--ag-font-ui); font-size: 12.5px; }
.setup-cancel { border: 1px solid var(--ag-line); background: var(--ag-surface); color: var(--ag-ink-2); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; }
.setup-close:disabled { opacity: .45; cursor: not-allowed; }

/* 登入畫面 */
.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--ag-bg); padding: 20px; font-family: var(--ag-font-ui); }
.login-card { width: 100%; max-width: 340px; background: var(--ag-surface); border: 1px solid var(--ag-line); border-radius: var(--ag-r-card); padding: 26px 22px; display: flex; flex-direction: column; gap: 12px; }
.login-card h1 { margin: 0 0 4px; font-family: var(--ag-font-num); font-size: 26px; color: var(--ag-ink); }
.login-card p { margin: 0 0 6px; font-size: 13px; color: var(--ag-ink-3); }
.login-card input { border: 1px solid var(--ag-line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px; }
.login-card button { border: 0; border-radius: 10px; padding: 11px; background: var(--ag-dark); color: var(--ag-ink-on-dark); font: inherit; font-size: 15px; cursor: pointer; }
.login-card button:disabled { opacity: .5; }
.login-error { font-size: 12.5px; color: var(--ag-accent); }

.drag-zone.drag-over { outline: 2px dashed var(--ag-accent); outline-offset: 2px; border-radius: var(--ag-r-item); }
.loading-screen, .error-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--ag-bg); color: var(--ag-ink); font-family: var(--ag-font-ui); text-align: center; padding: 20px; }
.error-screen pre { background: var(--ag-surface); padding: 10px; border-radius: 8px; font-size: 11px; max-width: 500px; overflow: auto; text-align: left; }


/* ==========================================================================
   多旅程版面：電腦版 B（左側欄＋主區）／手機版 C（我的旅程 → 單日 → 切換面板）
   ========================================================================== */

.ag-dot { display: inline-block; border-radius: 50%; flex: none; }

/* ---------- 共用：底部面板／置中視窗 ---------- */
.sheet-wrap, .modal-wrap { position: fixed; inset: 0; z-index: 200; display: flex; }

/* ============ 小工具 ============ */
function toDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function buildDays(startStr, endStr) {
  const days = [];
  const start = new Date(startStr + "T00:00:00");
  const end = new Date(endStr + "T00:00:00");
  if (isNaN(start) || isNaN(end) || start > end) return days;
  const cur = new Date(start);
  while (cur <= end) {
    days.push({ key: toDateStr(cur), md: `${cur.getMonth() + 1}/${cur.getDate()}`, weekdayIndex: cur.getDay() });
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}
function weekdayLabel(weekdayIndex, lang) {
  return lang === "en" ? WEEKDAY_EN[weekdayIndex] : "週" + WEEKDAY_ZH[weekdayIndex];
}
function nightsBetween(checkinStr, checkoutStr) {
  const nights = [];
  const start = new Date(checkinStr + "T00:00:00");
  const end = new Date(checkoutStr + "T00:00:00");
  if (isNaN(start) || isNaN(end) || start >= end) return nights;
  const cur = new Date(start);
  while (cur < end) { nights.push(toDateStr(cur)); cur.setDate(cur.getDate() + 1); }
  return nights;
}
function mapsUrl(name) { return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`; }
function fmtMd(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return dateStr;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

        <input className="edit-note" value={draft.note} onChange={(e) => setDraft({ ...draft, note: e.target.value })} placeholder={tt.itemNote} />

        {item.time && <span className="card-time">{item.time}</span>}
        <span className="card-acts">
          <span className={`toggle-badge book-badge ${item.booked ? "on" : ""}`} title={tt.booked} onClick={(e) => { e.stopPropagation(); onToggleBooked(item.id); }}><Check size={11} /></span>

        </span>
      </div>
      <div className="card-name">{item.name}</div>
      {item.note && <div className="card-note">{item.note}</div>}
    </div>
  );
}

/* ============ 旅程顯示輔助 ============ */
function localToday() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function dayDiff(a, b) {
  const [ay, am, ad] = a.split("-").map(Number);
  const [by, bm, bd] = b.split("-").map(Number);
  return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
}
// 顯示用：去掉 YYMMDD-YYMMDD_ 前綴和結尾（年份），資料庫裡的名稱不動
function cleanTripName(n) {
  const c = (n || "").replace(/^\d{6}-\d{6}_/, "").replace(/\s*[（(]\d{4}[）)]\s*$/, "").trim();
  return c || n || "";
}
function tripStatus(t, today, lang) {
  if (t.end_date < today) return { kind: "past", label: lang === "en" ? "Ended" : "已結束" };
  if (t.start_date <= today) {
    const n = dayDiff(t.start_date, today) + 1;
    return { kind: "live", label: lang === "en" ? "On trip · Day " + n : "旅行中 · 第 " + n + " 天" };
  }
  const n = dayDiff(today, t.start_date);
  return { kind: "soon", label: lang === "en" ? "In " + n + " days" : n + " 天後出發" };
}
function shortRange(t) {
  return (t.start_date || "").slice(5).replace("-", "/") + " – " + (t.end_date || "").slice(5).replace("-", "/");
}
function pickDefaultTrip(rows, savedId) {
  const saved = rows.find((t) => t.id === savedId);
  if (saved) return saved;
  const today = localToday();
  const up = rows.filter((t) => t.end_date >= today).sort((a, b) => a.start_date.localeCompare(b.start_date));
  if (up.length) return up[0];
  return [...rows].sort((a, b) => b.start_date.localeCompare(a.start_date))[0];
}

function Dot({ kind, dark, size }) {
  const c = kind === "past" ? (dark ? "#9ecabd" : "#4a7f6e") : "#c98a1e";
  return <span className="ag-dot" style={{ background: c, width: size || 10, height: size || 10 }} />;
}

  const [showAccount, setShowAccount] = useState(false);

  const [showMore, setShowMore] = useState(false);
  const [showAddMenu, setShowAddMenu] = useState(false);
  const [addMode, setAddMode] = useState(null);
  const [mobFilter, setMobFilter] = useState("all");
  const [allItemsLite, setAllItemsLite] = useState([]);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") { setShowAccount(false); setShowSwitcher(false); setShowInboxSheet(false); setShowMore(false); setShowAddMenu(false); setAddMode(null); setShowSetup(false); setShowNewTrip(false); } };

  }, []);
  const [activeDayIdx, setActiveDayIdx] = useState(0);
  const [editingId, setEditingId] = useState(null);
  const [dragItemId, setDragItemId] = useState(null);
  const inboxListRef = useRef(null);
  const dayListRef = useRef(null);
  const mapDivRef = useRef(null);
  const mapObjRef = useRef(null);
  const desktopGridRef = useRef(null);
  const [mapOpen, setMapOpen] = useState(false);
  const [mapDayIdx, setMapDayIdx] = useState(0);

  useEffect(() => {
    if (!isMobileForDrag()) return;
    if (typeof Sortable === "undefined") return;
    const opts = {
      group: "mobile-itinerary",
      animation: 150,
      ghostClass: "drag-over",
      filter: ".sortable-ignore",
      preventOnFilter: false,
      delay: 150,
      delayOnTouchOnly: true,
      touchStartThreshold: 5,
      onEnd: (evt) => {
        // Sortable 會直接搬動 DOM 節點，這裡先把它搬回原位，
        // 改成完全交給 React 依資料狀態重新渲染，避免兩邊打架造成畫面壞掉。
        if (evt.from && evt.item) {
          const referenceNode = evt.from.children[evt.oldIndex] || null;
          evt.from.insertBefore(evt.item, referenceNode);
        }
        const itemId = evt.item.getAttribute("data-item-id");
        const targetDayAttr = evt.to.getAttribute("data-day");
        const targetDay = targetDayAttr || null;
        if (itemId) moveItem(itemId, targetDay, evt.newIndex);
      },
    };
    const instances = [];
    if (inboxListRef.current) instances.push(Sortable.create(inboxListRef.current, opts));
    if (dayListRef.current) instances.push(Sortable.create(dayListRef.current, opts));
    return () => instances.forEach((s) => s.destroy());
  });
  function isMobileForDrag() {
    return viewMode === "mobile" && section === "itinerary";
  }

  // 讀取某一趟旅程的全部資料（行程、航班、飯店、購物清單）
  const loadTripData = async (trip) => {
    const [itemsRes, flightsRes, hotelsRes, shopRes] = await Promise.all([
      db.from("itinerary_items").select("*").eq("trip_id", trip.id),
      db.from("flights").select("*").eq("trip_id", trip.id),
      db.from("hotels").select("*").eq("trip_id", trip.id),
      db.from("shopping_items").select("*").eq("trip_id", trip.id),
    ]);
    if (itemsRes.error) throw itemsRes.error;
    if (flightsRes.error) throw flightsRes.error;
    if (hotelsRes.error) throw hotelsRes.error;
    if (shopRes.error) throw shopRes.error;

    setTripId(trip.id);
    setTripName(trip.name || "");
    setTripStart(trip.start_date);
    setTripEnd(trip.end_date);
    setItems(itemsRes.data.map(itemFromDb));
    setFlights(flightsRes.data.map(flightFromDb));
    setHotels(hotelsRes.data.map(hotelFromDb));
    setShopping(shopRes.data);
    // 換旅程時把畫面狀態歸零
    const todayStr = localToday();
    const startIdx = trip.start_date <= todayStr && todayStr <= trip.end_date ? dayDiff(trip.start_date, todayStr) : 0;
    setActiveDayIdx(startIdx);
    setMapDayIdx(startIdx);
    setEditingId(null);
    setShowSetup(false);
    setShowNewTrip(false);
    try { localStorage.setItem("agemda_trip_id", trip.id); } catch (e) {}
  };

  useEffect(() => {
    (async () => {
      try {
        let { data: tripRows, error: tripErr } = await db.from("trips").select("*").order("created_at");
        if (tripErr) throw tripErr;
        if (!tripRows || tripRows.length === 0) {
          const { data: created, error: createErr } = await db.from("trips").insert({ name: "我的旅程", start_date: tripStart, end_date: tripEnd }).select().single();
          if (createErr) throw createErr;
          tripRows = [created];
        }
        setTrips(tripRows);
        try {
          const lite = await db.from("itinerary_items").select("trip_id, day, is_transit");
          if (!lite.error) setAllItemsLite(lite.data || []);
        } catch (e) {}
        // 優先回到上次看的旅程；沒有的話就開最早建立的那一趟（原本的旅程）
        let saved = null;
        try { saved = localStorage.getItem("agemda_trip_id"); } catch (e) {}
        const trip = pickDefaultTrip(tripRows, saved);
        await loadTripData(trip);
        setLoading(false);
      } catch (e) {
        setLoadError(e);
        setLoading(false);
      }
    })();
  }, []);

  const handleSwitchTrip = async (id) => {
    const trip = trips.find((t) => t.id === id);
    if (!trip || id === tripId) return;
    try {
      await loadTripData(trip);
    } catch (e) {
      setLoadError(e);
    }
  };

  const handleCreateTrip = async () => {
    const name = (newTrip.name || "").trim() || T.newTripDefault;
    if (!newTrip.start || !newTrip.end || newTrip.end < newTrip.start) return;
    const { data, error } = await db.from("trips").insert({ name, start_date: newTrip.start, end_date: newTrip.end }).select().single();
    if (error) { setLoadError(error); return; }
    setTrips((prev) => [...prev, data]);
    try {
      await loadTripData(data);
    } catch (e) {
      setLoadError(e);
    }
  };

  const handleTripNameChange = async (val) => {
    setTripName(val);
    setTrips((prev) => prev.map((t) => (t.id === tripId ? { ...t, name: val } : t)));
  };
  const handleTripNameSave = async () => {
    if (tripId) await db.from("trips").update({ name: tripName }).eq("id", tripId);
  };

  const [exportStatus, setExportStatus] = useState("");
  const handleExportBackup = async () => {
    setExportStatus(T.exporting);
    try {
      const tables = ["trips", "itinerary_items", "flights", "hotels", "shopping_items"];
      const out = { exported_at: new Date().toISOString() };
      for (const t of tables) {
        const { data, error } = await db.from(t).select("*");
        if (error) throw error;
        out[t] = data;
      }
      const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "aGemda-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setExportStatus("");
    } catch (e) {
      setExportStatus((lang === "en" ? "Error: " : "發生錯誤：") + String(e.message || e));
    }
  };

  const days = useMemo(() => buildDays(tripStart, tripEnd), [tripStart, tripEnd]);

  useEffect(() => {
    if (!mapOpen) {
      mapObjRef.current = null;
      return;
    }
    if (typeof google === "undefined" || !google.maps || !mapDivRef.current) return;
    const day = days[mapDayIdx];
    if (!day) return;
    const points = manualListFor(day.key).filter((it) => it.lat != null && it.lng != null);

    if (mapObjRef.current && mapObjRef.current.getDiv() !== mapDivRef.current) {
      mapObjRef.current = null;
    }
    if (!mapObjRef.current) {
      mapObjRef.current = new google.maps.Map(mapDivRef.current, {
        center: points[0] ? { lat: points[0].lat, lng: points[0].lng } : { lat: 35.681236, lng: 139.767125 },
        zoom: 13,
        disableDefaultUI: true,
        zoomControl: true,
      });
    }
    const map = mapObjRef.current;

    if (map.__markers) map.__markers.forEach((m) => m.setMap(null));
    if (map.__line) map.__line.setMap(null);

    const markers = points.map(
      (p, i) =>
        new google.maps.Marker({
          position: { lat: p.lat, lng: p.lng },
          map,
          title: p.name,
          label: { text: String(i + 1), color: "#fff", fontSize: "11px" },
          icon: { path: google.maps.SymbolPath.CIRCLE, scale: 11, fillColor: "#C1524A", fillOpacity: 1, strokeWeight: 0 },
        })
    );
    map.__markers = markers;

    if (points.length > 1) {
      map.__line = new google.maps.Polyline({
        path: points.map((p) => ({ lat: p.lat, lng: p.lng })),
        map,
        strokeColor: "#C1524A",
        strokeOpacity: 0.9,
        strokeWeight: 3,
      });
    }

    if (points.length > 0) {
      const bounds = new google.maps.LatLngBounds();
      points.forEach((p) => bounds.extend({ lat: p.lat, lng: p.lng }));
      map.fitBounds(bounds, 40);
    } else {
      google.maps.event.trigger(map, "resize");
    }
  }, [mapOpen, mapDayIdx, items, days, viewMode]);

  const itemsForDay = (dayKey) => items.filter((it) => it.day === dayKey);
  const inboxItems = items.filter((it) => !it.day).sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));

  const autoItemsForDay = (dayKey) => {
    const timed = [];
    const nightly = [];
    flights.forEach((f) => {
      if (f.date === dayKey) {
        timed.push({ id: `auto-fl-${f.id}`, kind: "flight", tagLabel: f.note || T.flightDefaultTag, time: f.time || "", name: `${f.from || "?"} → ${f.to || "?"}${f.flightNo ? `（${f.flightNo}）` : ""}`, note: f.terminal ? `${T.terminalPrefix}${f.terminal}` : "", mapQuery: null, onDelete: () => handleFlightDelete(f.id), onEdit: () => { setSection("logistics"); setEditingId(f.id); } });
      }
    });
    hotels.forEach((h) => {
      if (h.checkin === dayKey) timed.push({ id: `auto-ht-in-${h.id}`, kind: "hotel", tagLabel: T.checkIn, time: h.checkinTime || "", name: h.name || T.unnamedHotel, note: h.address, mapQuery: h.address || h.name, onDelete: () => handleHotelDelete(h.id), onEdit: () => { setSection("logistics"); setEditingId(h.id); } });
      if (h.checkout === dayKey) timed.push({ id: `auto-ht-out-${h.id}`, kind: "hotel", tagLabel: T.checkOut, time: h.checkoutTime || "", name: h.name || T.unnamedHotel, note: h.address, mapQuery: h.address || h.name, onDelete: () => handleHotelDelete(h.id), onEdit: () => { setSection("logistics"); setEditingId(h.id); } });
      if (nightsBetween(h.checkin, h.checkout).includes(dayKey)) nightly.push(h);
    });
    return { timed, nightly };
  };

  const displayItem = (it) => (lang === "en" ? { ...it, name: it.nameEn || it.name, note: it.noteEn || it.note } : it);
  const getDayCards = (dayKey) => {
    const { timed: autoTimed, nightly } = autoItemsForDay(dayKey);
    let mapCounter = 0;
    const manual = itemsForDay(dayKey)
      .map((it) => ({ ...it, __manual: true }))
      .sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0))
      .map((it) => {
        const withMap = it.lat != null && it.lng != null ? { ...it, mapIndex: (mapCounter += 1) } : { ...it, mapIndex: null };
        return displayItem(withMap);
      });
    return { auto: autoTimed, manual, nightly };
  };

  const midpointOrder = (before, after) => {
    if (before == null && after == null) return Date.now() / 1000;
    if (before == null) return after - 1;
    if (after == null) return before + 1;
    return (before + after) / 2;
  };

  const manualListFor = (dayKeyOrNull) =>
    items
      .filter((it) => (dayKeyOrNull === null ? !it.day : it.day === dayKeyOrNull))
      .sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));

  const handleMapClick = (name) => window.open(mapsUrl(name), "_blank");

  /* ---- 行程項目 CRUD ---- */
  const handleDragStart = (e, id) => { setDragItemId(id); e.dataTransfer.effectAllowed = "move"; };
  const handleDragEnd = () => setDragItemId(null);

  const moveItem = async (id, targetDayKeyOrNull, targetIndex) => {
    const targetList = manualListFor(targetDayKeyOrNull).filter((it) => it.id !== id);
    const clampedIndex = Math.max(0, Math.min(targetIndex, targetList.length));
    const before = targetList[clampedIndex - 1];
    const after = targetList[clampedIndex];
    const newSortOrder = midpointOrder(before?.sortOrder, after?.sortOrder);
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, day: targetDayKeyOrNull, sortOrder: newSortOrder } : it)));
    await db.from("itinerary_items").update({ day: targetDayKeyOrNull, sort_order: newSortOrder }).eq("id", id);
  };
  const handleDropOnDay = async (e, dayKey) => {
    e.preventDefault();
    e.stopPropagation();
    const id = dragItemId;
    if (!id) return;
    await moveItem(id, dayKey, manualListFor(dayKey).length);
  };
  const handleDropBeforeCard = async (e, dayKeyOrNull, beforeItemId) => {
    e.preventDefault();
    e.stopPropagation();
    const id = dragItemId;
    if (!id || id === beforeItemId) return;
    const list = manualListFor(dayKeyOrNull).filter((it) => it.id !== id);
    const idx = list.findIndex((it) => it.id === beforeItemId);
    await moveItem(id, dayKeyOrNull, idx === -1 ? list.length : idx);
  };
  const assignDay = async (id, dayKey) => {
    await moveItem(id, dayKey, manualListFor(dayKey).length);
  };
  tripIdRef.current = tripId;
  // 手動新增／改名的地點沒有座標，地圖就連不起來；這裡在背景自動補座標，補好再重新讀取
  const geoTimerRef = useRef(null);
  const runGeocode = async (tid) => {
    try {
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ trip_id: tid, backfill: true }),
      });
      const data = await res.json();
      if (data && data.updated_count > 0 && tripIdRef.current === tid) {
        const { data: rows } = await db.from("itinerary_items").select("*").eq("trip_id", tid);
        if (rows) setItems(rows.map(itemFromDb));
      }
    } catch (e) { /* 補不到就算了，之後可以按「補齊座標／翻譯」 */ }
  };
  // 連續新增時合併成一次（停 2.5 秒才送出），避免重複查詢
  const autoGeocode = () => {
    const tid = tripId;
    clearTimeout(geoTimerRef.current);
    geoTimerRef.current = setTimeout(() => runGeocode(tid), 2500);
  };
  // 打開旅程時，如果有地點還沒有座標（例如早期手動輸入的），自動補一次（每趟旅程每次開網站只補一次）
  const geoTriedRef = useRef({});
  useEffect(() => {
    if (loading || !tripId || geoTriedRef.current[tripId]) return;
    if (items.some((it) => it.lat == null && !it.nameEn)) {
      geoTriedRef.current[tripId] = true;
      autoGeocode();
    }
  }, [loading, tripId, items]);
  const handleAdd = async (dayKey, name) => {
    const { data, error } = await db.from("itinerary_items").insert({ trip_id: tripId, day: dayKey, time: "", name, note: "" }).select().single();
    if (!error) { setItems((prev) => [...prev, itemFromDb(data)]); autoGeocode(); }
  };
  const handleAddTransit = async (dayKey, name) => {
    const { data, error } = await db.from("itinerary_items").insert({ trip_id: tripId, day: dayKey, time: "", name, note: "", is_transit: true }).select().single();
    if (!error) { setItems((prev) => [...prev, itemFromDb(data)]); autoGeocode(); }
  };
  const handleToggleBooked = async (id) => {
    const target = items.find((it) => it.id === id);
    if (!target) return;
    const nextVal = !target.booked;
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, booked: nextVal } : it)));
    await db.from("itinerary_items").update({ booked: nextVal }).eq("id", id);
  };
  const handleToggleImportant = async (id) => {
    const target = items.find((it) => it.id === id);
    if (!target) return;
    const nextVal = !target.important;
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, important: nextVal } : it)));
    await db.from("itinerary_items").update({ important: nextVal }).eq("id", id);
  };
  const handleAddInbox = async (name) => {
    const { data, error } = await db.from("itinerary_items").insert({ trip_id: tripId, day: null, time: "", name, note: "" }).select().single();
    if (!error) { setItems((prev) => [...prev, itemFromDb(data)]); autoGeocode(); }
  };
  const handleDelete = async (id) => {
    setItems((prev) => prev.filter((it) => it.id !== id));
    await db.from("itinerary_items").delete().eq("id", id);
  };
  const handleEditSave = async (id, draft) => {
    const before = items.find((it) => it.id === id);
    const renamed = before && (before.name || "").trim() !== (draft.name || "").trim();
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...draft, ...(renamed ? { lat: null, lng: null } : {}) } : it)));
    setEditingId(null);
    const patch = { time: draft.time, name: draft.name, note: draft.note };
    if (renamed) Object.assign(patch, { lat: null, lng: null, name_en: null, note_en: null });
    await db.from("itinerary_items").update(patch).eq("id", id);
    if (renamed) autoGeocode();
  };

  /* ---- 航班 CRUD ---- */
  const handleAddFlight = async () => {
    const { data, error } = await db.from("flights").insert({ trip_id: tripId, date: tripStart, time: "", flight_no: "", from_code: "", to_code: "", terminal: "", note: "" }).select().single();
    if (!error) setFlights((prev) => [...prev, flightFromDb(data)]);
  };
  const handleFlightSave = async (id, draft) => {
    setFlights((prev) => prev.map((f) => (f.id === id ? draft : f)));
    setEditingId(null);
    await db.from("flights").update(flightToDb(draft)).eq("id", id);
  };
  const handleFlightDelete = async (id) => {
    setFlights((prev) => prev.filter((f) => f.id !== id));
    await db.from("flights").delete().eq("id", id);
  };

  /* ---- 飯店 CRUD ---- */
  const handleAddHotel = async () => {
    const { data, error } = await db.from("hotels").insert({ trip_id: tripId, name: "", address: "", checkin: tripStart, checkin_time: "15:00", checkout: tripEnd, checkout_time: "11:00", confirmation: "" }).select().single();
    if (!error) setHotels((prev) => [...prev, hotelFromDb(data)]);
  };
  const handleHotelSave = async (id, draft) => {
    setHotels((prev) => prev.map((h) => (h.id === id ? draft : h)));
    setEditingId(null);
    await db.from("hotels").update(hotelToDb(draft)).eq("id", id);
  };
  const handleHotelDelete = async (id) => {
    setHotels((prev) => prev.filter((h) => h.id !== id));
    await db.from("hotels").delete().eq("id", id);
  };

  /* ---- 購物清單 CRUD ---- */
  const handleAddShopping = async (text) => {
    const { data, error } = await db.from("shopping_items").insert({ trip_id: tripId, text, checked: false }).select().single();
    if (!error) setShopping((prev) => [...prev, data]);
  };
  const handleToggleShopping = async (id) => {
    const target = shopping.find((s) => s.id === id);
    if (!target) return;
    const next = !target.checked;
    setShopping((prev) => prev.map((s) => (s.id === id ? { ...s, checked: next } : s)));
    await db.from("shopping_items").update({ checked: next }).eq("id", id);
  };
  const handleDeleteShopping = async (id) => {
    setShopping((prev) => prev.filter((s) => s.id !== id));
    await db.from("shopping_items").delete().eq("id", id);
  };

  /* ---- 旅程日期 ---- */
  const handleTripStartChange = async (val) => {
    setTripStart(val);
    setTrips((prev) => prev.map((t) => (t.id === tripId ? { ...t, start_date: val } : t)));
    if (tripId) await db.from("trips").update({ start_date: val }).eq("id", tripId);
  };
  const handleTripEndChange = async (val) => {
    setTripEnd(val);
    setTrips((prev) => prev.map((t) => (t.id === tripId ? { ...t, end_date: val } : t)));
    if (tripId) await db.from("trips").update({ end_date: val }).eq("id", tripId);
  };

  const [backfillStatus, setBackfillStatus] = useState("");
  const handleSmartPaste = async (text) => {
    try {
      const { data: sd } = await db.auth.getSession();
      const jwt = sd && sd.session ? sd.session.access_token : null;
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + (jwt || SUPABASE_ANON_KEY), "Content-Type": "application/json" },
        body: JSON.stringify({ text, trip_id: tripId }),
      });
      const data = await res.json();
      if (!res.ok || data.error || !data.created_count) {
        return { ok: false, message: (lang === "en" ? "Nothing added: " : "沒有加入：") + (data.error || (lang === "en" ? "no place found" : "沒有辨識出地點")) };
      }
      const { data: itemsData } = await db.from("itinerary_items").select("*").eq("trip_id", tripId);
      if (itemsData) setItems(itemsData.map(itemFromDb));
      const names = (data.names || []).join("、");
      return { ok: true, message: (lang === "en" ? "Added " + data.created_count + ": " : "已加入 " + data.created_count + " 個：") + names };
    } catch (e) {
      return { ok: false, message: (lang === "en" ? "Error: " : "發生錯誤：") + String(e) };
    }
  };

  const handleBackfillLocations = async () => {
    setBackfillStatus(T.backfilling);
    try {
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ trip_id: tripId, backfill: true }),
      });
      const data = await res.json();
      if (data.error) {
        setBackfillStatus((lang === "en" ? "Failed: " : "失敗：") + data.error);
        return;
      }
      setBackfillStatus(lang === "en" ? `Updated ${data.updated_count} items` : `已補上 ${data.updated_count} 筆`);
      const { data: itemsData } = await db.from("itinerary_items").select("*").eq("trip_id", tripId);
      if (itemsData) setItems(itemsData.map(itemFromDb));
    } catch (e) {
      setBackfillStatus((lang === "en" ? "Error: " : "發生錯誤：") + String(e));
    }
  };

  if (loading) return <div className="loading-screen">{T.loadingText}</div>;
  if (loadError) {
    return (
      <div className="error-screen">
        <div>
          <p>{T.errorText}</p>
          <pre>{String(loadError.message || loadError)}</pre>
        </div>
      </div>
    );
  }

  const activeDay = days[Math.min(activeDayIdx, Math.max(days.length - 1, 0))];
  const isMobile = viewMode === "mobile";
  const shoppingDone = shopping.filter((s) => s.checked).length;
  const mapDay = days[mapDayIdx];
  const mapPoints = mapDay ? getDayCards(mapDay.key).manual.filter((it) => it.lat != null && it.lng != null) : [];
  const panMapTo = (pt) => {
    if (mapObjRef.current) {
      mapObjRef.current.panTo({ lat: pt.lat, lng: pt.lng });
      mapObjRef.current.setZoom(16);
    }
  };

  // ---------- 旅程清單與統計 ----------
  const today = localToday();
  const upcomingTrips = trips.filter((t) => t.end_date >= today).sort((a, b) => a.start_date.localeCompare(b.start_date));
  const pastTrips = trips.filter((t) => t.end_date < today).sort((a, b) => b.start_date.localeCompare(a.start_date));
  const nextTrip = upcomingTrips[0] || null;
  const statText = (t) => {
    const rows = t.id === tripId ? items.map((i) => ({ day: i.day, is_transit: i.isTransit })) : allItemsLite.filter((r) => r.trip_id === t.id);
    const places = rows.filter((r) => r.day && !r.is_transit).length;
    const days = dayDiff(t.start_date, t.end_date) + 1;
    return lang === "en" ? days + " days · " + places + " places" : days + " 天 · " + places + " 個地點";
  };
  const curTrip = trips.find((t) => t.id === tripId) || { id: tripId, name: tripName, start_date: tripStart, end_date: tripEnd };
  const curName = cleanTripName(tripName);
  const curRange = tripStart.slice(5).replace("-", "/") + " – " + tripEnd.slice(5).replace("-", "/");
  const dayOptions = days.map((d) => ({ key: d.key, label: d.md + " " + weekdayLabel(d.weekdayIndex, lang) }));
  const Wrap = isMobile ? Sheet : Modal;
  const userEmail = (typeof sessionEmail === "string" && sessionEmail) || "";

  const openTripMobile = async (t) => {
    if (t.id !== tripId) await handleSwitchTrip(t.id);
    setMobScreen("trip");
    setSection("itinerary");
    setMapOpen(false);
  };
  const pickDay = (i) => { setActiveDayIdx(i); setMapDayIdx(i); };
  const goTab = (k) => {
    if (k === "map") { setMapOpen(true); }
    else { setMapOpen(false); setSection(k); }
  };
  const activeTab = mapOpen ? "map" : section;

  // ---------- 共用：旅程列 ----------
  const sideRow = (t) => {
    const st = tripStatus(t, today, lang);
    const cur = t.id === tripId;
    return (
      <button key={t.id} className={`ag-trip ${cur ? "is-cur" : ""}`} onClick={() => handleSwitchTrip(t.id)}>
        <Dot kind={st.kind === "past" ? "past" : "soon"} dark={cur} />
        <span className="ag-trip__txt">
          <span className="ag-trip__name">{cleanTripName(t.name)}</span>
          <span className="ag-trip__sub">{shortRange(t)} · {st.label}</span>
        </span>
      </button>
    );
  };
  const sheetRow = (t) => {
    const st = tripStatus(t, today, lang);
    const cur = t.id === tripId;
    return (
      <button key={t.id} className={`sw-row ${cur ? "is-cur" : ""}`} onClick={() => { setShowSwitcher(false); openTripMobile(t); }}>
        <Dot kind={st.kind === "past" ? "past" : "soon"} dark={cur} />
        <span className="sw-row__txt">
          <span className="sw-row__name">{cleanTripName(t.name)}</span>
          <span className="sw-row__sub">{shortRange(t)} · {st.label}</span>
        </span>
        {cur && <span className="sw-row__check"><Check size={16} /></span>}
      </button>
    );
  };
  const homeRow = (t) => {
    const st = tripStatus(t, today, lang);
    const past = st.kind === "past";
    return (
      <button key={t.id} className="mob-trip" onClick={() => openTripMobile(t)}>
        <span className={`mob-trip__thumb ${past ? "is-past" : ""}`}><Dot kind={past ? "past" : "soon"} size={18} /></span>
        <span className="mob-trip__txt">
          <span className="mob-trip__name">{cleanTripName(t.name)}</span>
          <span className="mob-trip__range">{shortRange(t)}</span>
          <span className="mob-trip__stat">{statText(t)}</span>
        </span>
        <span className={`mob-pill ${past ? "is-past" : ""}`}>{st.label}</span>
      </button>
    );
  };
  const openNewTrip = () => { setNewTrip({ name: "", start: "", end: "" }); setShowNewTrip(true); setShowSetup(false); setShowSwitcher(false); setShowAccount(false); };

  const accountMenu = (
    <AccountMenu
      T={T} lang={lang} setLang={setLang} layoutPref={layoutPref} setLayout={setLayout}
      onExport={handleExportBackup} exportStatus={exportStatus} onSignOut={onSignOut} userEmail={userEmail}
    />
  );

  // ---------- 彈出的表單（新增旅程／編輯旅程） ----------
  const formOverlays = (
    <React.Fragment>
      {showNewTrip && (
        <Wrap title={T.newTrip} onClose={() => setShowNewTrip(false)}>
          <div className="form-grid">
            <div className="setup-field"><label>{T.tripName}</label><input type="text" value={newTrip.name} placeholder={T.newTripDefault} onChange={(e) => setNewTrip({ ...newTrip, name: e.target.value })} /></div>
            <div className="setup-field"><label>{T.departureDate}</label><input type="date" value={newTrip.start} onChange={(e) => setNewTrip({ ...newTrip, start: e.target.value, end: newTrip.end && newTrip.end < e.target.value ? e.target.value : newTrip.end })} /></div>
            <div className="setup-field"><label>{T.returnDate}</label><input type="date" min={newTrip.start} value={newTrip.end} onChange={(e) => setNewTrip({ ...newTrip, end: e.target.value })} /></div>
          </div>
          <div className="form-btns">
            <button className="setup-cancel" onClick={() => setShowNewTrip(false)}>{T.cancel}</button>
            <button className="setup-close" disabled={!newTrip.start || !newTrip.end} onClick={async () => { await handleCreateTrip(); if (isMobile) setMobScreen("trip"); }}>{T.createTrip}</button>
          </div>
        </Wrap>
      )}
      {showSetup && (
        <Wrap title={T.editTrip} onClose={() => { handleTripNameSave(); setShowSetup(false); }}>
          <div className="form-grid">
            <div className="setup-field"><label>{T.tripName}</label><input type="text" value={tripName} onChange={(e) => handleTripNameChange(e.target.value)} onBlur={handleTripNameSave} /></div>
            <div className="setup-field"><label>{T.departureDate}</label><input type="date" value={tripStart} onChange={(e) => handleTripStartChange(e.target.value)} /></div>
            <div className="setup-field"><label>{T.returnDate}</label><input type="date" value={tripEnd} onChange={(e) => handleTripEndChange(e.target.value)} /></div>
          </div>
          <div className="form-btns">
            <button className="setup-close" onClick={() => { handleTripNameSave(); setShowSetup(false); }}>{T.done}</button>
          </div>
        </Wrap>
      )}
    </React.Fragment>
  );

  // ---------- 共用內容區塊 ----------
  const logiShopBlock = (
    <React.Fragment>
      {section === "logistics" && (
        <div className={isMobile ? "mobile-wrap" : ""} style={isMobile ? {} : { padding: "24px 36px 28px" }}>
          <div className="logi-section">
            <div>
              <div className="logi-group-label">{T.flightGroup}</div>
              <div className="logi-list">
                {flights.map((f) => <FlightCard key={f.id} flight={f} T={T} isEditing={editingId === f.id} onEditStart={setEditingId} onEditSave={handleFlightSave} onDelete={handleFlightDelete} />)}
                <button className="logi-add" onClick={handleAddFlight}><Plus size={13} /> {T.addFlight}</button>
              </div>
            </div>
            <div>
              <div className="logi-group-label">{T.hotelGroup}</div>
              <div className="logi-list">
                {hotels.map((h) => <HotelCard key={h.id} hotel={h} T={T} isEditing={editingId === h.id} onEditStart={setEditingId} onEditSave={handleHotelSave} onDelete={handleHotelDelete} onMapClick={handleMapClick} />)}
                <button className="logi-add" onClick={handleAddHotel}><Plus size={13} /> {T.addHotel}</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {section === "shopping" && (

          <div className="sortable-ignore" style={{ marginTop: 10 }}>
            <AddInline onAdd={handleAddInbox} placeholder={T.addToInbox} inputPlaceholder={T.inputContent} />
<SmartPaste T={T} onSubmit={handleSmartPaste} />
          </div>
        </Sheet>
      )}
      {showAddMenu && (
        <Sheet onClose={() => setShowAddMenu(false)}>
          <button className="acct__item" onClick={() => { setShowAddMenu(false); setAddMode("item"); }}><Plus size={15} /> <span>{T.addItem}</span></button>
          <button className="acct__item" onClick={() => { setShowAddMenu(false); setAddMode("transit"); }}><Plus size={15} /> <span>{T.addTransit}</span></button>
          <button className="acct__item" onClick={() => { setShowAddMenu(false); setAddMode("inbox"); }}><Plus size={15} /> <span>{T.addToInbox}</span></button>
        </Sheet>
      )}
      {addMode && (
        <QuickAdd
          title={addMode === "item" ? T.addItem : addMode === "transit" ? T.addTransit : T.addToInbox}
          placeholder={T.inputContent}
          okLabel={T.ok}
          onClose={() => setAddMode(null)}
          onSubmit={(name) => {
            if (addMode === "inbox") handleAddInbox(name);
            else if (addMode === "transit") handleAddTransit(activeDay.key, name);
            else handleAdd(activeDay.key, name);
          }}
        />
      )}
    </React.Fragment>
  );

  return (
    <React.Fragment>
      {isMobile ? mobileUI : desktopUI}
      {formOverlays}
      {isMobile && mobileSheets}
    </React.Fragment>
  );
}

/* ============ 登入 ============ */
function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    setErr("");
    const { error } = await db.auth.signInWithPassword({ email: email.trim(), password });
    if (error) setErr("登入失敗，請確認 email 和密碼是否正確。");
    setBusy(false);
  };

  return (
    <div className="login-screen">
      <form className="login-card" onSubmit={submit}>
        <h1>aGemda</h1>
        <p>請登入以查看旅程</p>
        <input type="email" autoComplete="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} required />
        <input type="password" autoComplete="current-password" placeholder="密碼" value={password} onChange={(e) => setPassword(e.target.value)} required />
        {err && <div className="login-error">{err}</div>}
        <button type="submit" disabled={busy}>{busy ? "登入中…" : "登入"}</button>
      </form>
    </div>
  );
}

function Root() {
  const [session, setSession] = useState(undefined);
  useEffect(() => {
    db.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = db.auth.onAuthStateChange((_event, s) => setSession(s || null));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) return <div className="loading-screen">載入中…</div>;
  if (!session) return <LoginScreen />;
  // key 綁 user id：登出再換別人登入時，整個 App 重新載入
  return <App key={session.user.id} sessionEmail={session.user.email} onSignOut={() => db.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
