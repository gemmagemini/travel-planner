    var missing = [];

<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useRef } = React;

/* ============ Supabase 設定 ============ */
const SUPABASE_URL = "https://srcdjdomsdwzdcwmivtx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_bdAnUH4j8-z6N__aux2pig_Fg0yq2kO";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const WEEKDAY = ["日", "一", "二", "三", "四", "五", "六"];

/* ============ 小工具 ============ */
function toDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function buildDays(startStr, endStr) {
  const days = [];
  const start = new Date(startStr + "T00:00:00");
  const end = new Date(endStr + "T00:00:00");
  if (isNaN(start) || isNaN(end) || start > end) return days;
  const cur = new Date(start);
  while (cur <= end) {
    days.push({ key: toDateStr(cur), md: `${cur.getMonth() + 1}/${cur.getDate()}`, weekday: WEEKDAY[cur.getDay()] });
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}
function nightsBetween(checkinStr, checkoutStr) {
  const nights = [];
  const start = new Date(checkinStr + "T00:00:00");
  const end = new Date(checkoutStr + "T00:00:00");
  if (isNaN(start) || isNaN(end) || start >= end) return nights;
  const cur = new Date(start);
  while (cur < end) { nights.push(toDateStr(cur)); cur.setDate(cur.getDate() + 1); }
  return nights;
}
function mapsUrl(name) { return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name)}`; }
function fmtMd(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  if (isNaN(d)) return dateStr;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

/* ============ 圖示（簡化版，避免額外套件依賴） ============ */
function Icon({ children, size = 16 }) {
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
}
const MapPin = (p) => <Icon {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></Icon>;
const XIcon = (p) => <Icon {...p}><path d="M18 6 6 18" /><path d="M6 6l12 12" /></Icon>;
const Check = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5" /></Icon>;
const Plus = (p) => <Icon {...p}><path d="M12 5v14" /><path d="M5 12h14" /></Icon>;
const Monitor = (p) => <Icon {...p}><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8" /><path d="M12 17v4" /></Icon>;
const Smartphone = (p) => <Icon {...p}><rect x="6" y="2" width="12" height="20" rx="2" /><path d="M11 18h2" /></Icon>;
const Plane = (p) => <Icon {...p}><path d="M22 2 11 13" /><path d="M22 2 15 22l-4-9-9-4Z" /></Icon>;
const Building2 = (p) => <Icon {...p}><rect x="4" y="2" width="16" height="20" rx="1" /><path d="M9 22v-4h6v4" /><path d="M8 6h1" /><path d="M15 6h1" /><path d="M8 10h1" /><path d="M15 10h1" /><path d="M8 14h1" /><path d="M15 14h1" /></Icon>;
const ShoppingBag = (p) => <Icon {...p}><path d="M6 8h12l-1 13H7L6 8Z" /><path d="M9 8V6a3 3 0 0 1 6 0v2" /></Icon>;
const ListChecks = (p) => <Icon {...p}><path d="M3 6l2 2 4-4" /><path d="M11 6h10" /><path d="M3 12l2 2 4-4" /><path d="M11 12h10" /><path d="M3 18l2 2 4-4" /><path d="M11 18h10" /></Icon>;
const GripVertical = (p) => <Icon {...p}><circle cx="9" cy="6" r="1" /><circle cx="9" cy="12" r="1" /><circle cx="9" cy="18" r="1" /><circle cx="15" cy="6" r="1" /><circle cx="15" cy="12" r="1" /><circle cx="15" cy="18" r="1" /></Icon>;

/* ============ DB <-> App 資料映射 ============ */
const flightFromDb = (r) => ({ id: r.id, date: r.date, time: r.time || "", flightNo: r.flight_no || "", from: r.from_code || "", to: r.to_code || "", terminal: r.terminal || "", note: r.note || "" });
const flightToDb = (d) => ({ date: d.date, time: d.time, flight_no: d.flightNo, from_code: d.from, to_code: d.to, terminal: d.terminal, note: d.note });
const hotelFromDb = (r) => ({ id: r.id, name: r.name || "", address: r.address || "", checkin: r.checkin, checkinTime: r.checkin_time || "", checkout: r.checkout, checkoutTime: r.checkout_time || "", confirmation: r.confirmation || "" });
const hotelToDb = (d) => ({ name: d.name, address: d.address, checkin: d.checkin, checkin_time: d.checkinTime, checkout: d.checkout, checkout_time: d.checkoutTime, confirmation: d.confirmation });
const itemFromDb = (r) => ({ id: r.id, day: r.day, time: r.time || "", name: r.name, note: r.note || "" });

/* ============ 行程卡片 ============ */
function ItemCard({ item, draggable, onDragStart, onDragEnd, onMapClick, onDelete, isEditing, onEditStart, onEditSave }) {
  const [draft, setDraft] = useState({ time: item.time, name: item.name, note: item.note });
  if (isEditing) {
    return (
      <div className="card editing">
        <div className="edit-row">
          <input className="edit-time" value={draft.time} onChange={(e) => setDraft({ ...draft, time: e.target.value })} placeholder="時間" />
          <button className="icon-btn save-btn" onClick={() => onEditSave(item.id, draft)}><Check size={14} /></button>
        </div>
        <input className="edit-name" value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} placeholder="地點名稱" autoFocus />
        <input className="edit-note" value={draft.note} onChange={(e) => setDraft({ ...draft, note: e.target.value })} placeholder="備註" />
      </div>
    );
  }
  return (
    <div className="card" draggable={draggable} onDragStart={draggable ? (e) => onDragStart(e, item.id) : undefined} onDragEnd={draggable ? onDragEnd : undefined}>
      <div className="card-top">
        {draggable && <GripVertical size={14} className="grip" />}
        {item.time && <span className="card-time">{item.time}</span>}
        <button className="icon-btn edit-btn" title="編輯" onClick={() => onEditStart(item.id)}><Pencil size={12} /></button>
        <button className="icon-btn map-btn" title="在 Google Maps 開啟" onClick={() => onMapClick(item.name)}><MapPin size={13} /></button>
        <button className="icon-btn del-btn" title="刪除" onClick={() => onDelete(item.id)}><XIcon size={13} /></button>
      </div>
      <div className="card-name">{item.name}</div>
      {item.note && <div className="card-note">{item.note}</div>}
    </div>
  );
}

function AutoItemCard({ item, onMapClick, onDelete }) {
  const IconC = item.kind === "flight" ? Plane : Building2;
  return (
    <div className="card auto">
      <div className="card-top">
        <span className="card-kind-tag"><IconC size={10} /> {item.tagLabel}</span>
        {item.time && <span className="card-time">{item.time}</span>}
        <button className="icon-btn edit-btn" title="去航班・飯店分頁編輯（含改日期）" onClick={item.onEdit}><Pencil size={12} /></button>
        {item.mapQuery && <button className="icon-btn map-btn" title="在 Google Maps 開啟" onClick={() => onMapClick(item.mapQuery)}><MapPin size={13} /></button>}
        <button className="icon-btn del-btn" title="刪除（會一併從航班・飯店移除）" onClick={item.onDelete}><XIcon size={13} /></button>
      </div>
      <div className="card-name">{item.name}</div>
      {item.note && <div className="card-note">{item.note}</div>}
    </div>
  );
}

function NightlyHotelStrip({ hotel, onMapClick }) {
  return (
    <div className="night-strip" onClick={() => onMapClick(hotel.address || hotel.name)}>
      <Building2 size={11} /><span>今晚住宿：{hotel.name || "（未命名飯店）"}</span>
    </div>
  );
}

function AddInline({ onAdd, placeholder }) {
  const [open, setOpen] = useState(false);
  const [val, setVal] = useState("");
  if (!open) return <button className="add-row" onClick={() => setOpen(true)}><Plus size={13} /> {placeholder || "新增項目"}</button>;
  return (
    <form className="add-form" onSubmit={(e) => { e.preventDefault(); if (val.trim()) onAdd(val.trim()); setVal(""); setOpen(false); }}>
      <input autoFocus value={val} onChange={(e) => setVal(e.target.value)} placeholder="輸入內容" onBlur={() => { if (!val.trim()) setOpen(false); }} />
    </form>
  );
}

/* ============ 航班／飯店卡片 ============ */
function FlightCard({ flight, isEditing, onEditStart, onEditSave, onDelete }) {
  const [draft, setDraft] = useState(flight);
  if (isEditing) {
    return (
      <div className="logi-card editing">
        <div className="logi-edit-grid">
          <input value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })} placeholder="日期 YYYY-MM-DD" />
          <input value={draft.time} onChange={(e) => setDraft({ ...draft, time: e.target.value })} placeholder="時間" />
          <input value={draft.flightNo} onChange={(e) => setDraft({ ...draft, flightNo: e.target.value })} placeholder="航班號" />
          <input value={draft.terminal} onChange={(e) => setDraft({ ...draft, terminal: e.target.value })} placeholder="航廈" />
          <input value={draft.from} onChange={(e) => setDraft({ ...draft, from: e.target.value })} placeholder="出發地" />
          <input value={draft.to} onChange={(e) => setDraft({ ...draft, to: e.target.value })} placeholder="目的地" />
        </div>
        <input className="logi-note-input" value={draft.note} onChange={(e) => setDraft({ ...draft, note: e.target.value })} placeholder="備註（去程／回程）" />
        <button className="icon-btn save-btn logi-save" onClick={() => onEditSave(flight.id, draft)}><Check size={14} /> 儲存</button>
      </div>
    );
  }
  return (
    <div className="logi-card">
      <div className="logi-icon"><Plane size={16} /></div>
      <div className="logi-main">
        <div className="logi-top-row"><span className="logi-date">{fmtMd(flight.date)}</span>{flight.note && <span className="logi-tag">{flight.note}</span>}</div>
        <div className="logi-title">{flight.from} → {flight.to}</div>
        <div className="logi-sub">{flight.flightNo} · {flight.time}{flight.terminal ? ` · 航廈 ${flight.terminal}` : ""}</div>
      </div>
      <div className="logi-actions">
        <button className="icon-btn edit-btn" onClick={() => onEditStart(flight.id)}><Pencil size={12} /></button>
        <button className="icon-btn del-btn" onClick={() => onDelete(flight.id)}><XIcon size={13} /></button>
      </div>
    </div>
  );
}

function HotelCard({ hotel, isEditing, onEditStart, onEditSave, onDelete, onMapClick }) {
  const [draft, setDraft] = useState(hotel);
  if (isEditing) {
    return (
      <div className="logi-card editing">
        <input className="logi-note-input" value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} placeholder="飯店名稱" autoFocus />
        <input className="logi-note-input" value={draft.address} onChange={(e) => setDraft({ ...draft, address: e.target.value })} placeholder="地址" />
        <div className="logi-edit-grid">
          <input value={draft.checkin} onChange={(e) => setDraft({ ...draft, checkin: e.target.value })} placeholder="入住 YYYY-MM-DD" />
          <input value={draft.checkinTime} onChange={(e) => setDraft({ ...draft, checkinTime: e.target.value })} placeholder="入住時間 15:00" />
          <input value={draft.checkout} onChange={(e) => setDraft({ ...draft, checkout: e.target.value })} placeholder="退房 YYYY-MM-DD" />
          <input value={draft.checkoutTime} onChange={(e) => setDraft({ ...draft, checkoutTime: e.target.value })} placeholder="退房時間 11:00" />
        </div>
        <input className="logi-note-input" value={draft.confirmation} onChange={(e) => setDraft({ ...draft, confirmation: e.target.value })} placeholder="訂房確認碼（選填）" />
        <button className="icon-btn save-btn logi-save" onClick={() => onEditSave(hotel.id, draft)}><Check size={14} /> 儲存</button>
      </div>
    );
  }
  return (
    <div className="logi-card">
      <div className="logi-icon"><Building2 size={16} /></div>
      <div className="logi-main">
        <div className="logi-top-row"><span className="logi-date">{fmtMd(hotel.checkin)} {hotel.checkinTime} – {fmtMd(hotel.checkout)} {hotel.checkoutTime}</span></div>
        <div className="logi-title">{hotel.name}</div>
        <div className="logi-sub">{hotel.address}</div>
      </div>
      <div className="logi-actions">
        <button className="icon-btn map-btn" title="在 Google Maps 開啟" onClick={() => onMapClick(hotel.address || hotel.name)}><MapPin size={13} /></button>
        <button className="icon-btn edit-btn" onClick={() => onEditStart(hotel.id)}><Pencil size={12} /></button>
        <button className="icon-btn del-btn" onClick={() => onDelete(hotel.id)}><XIcon size={13} /></button>
      </div>
    </div>
  );
}

function ShoppingRow({ item, onToggle, onDelete }) {
  return (
    <div className="shop-row">
      <button className={`shop-check ${item.checked ? "checked" : ""}`} onClick={() => onToggle(item.id)}>{item.checked && <Check size={12} />}</button>
      <span className={`shop-text ${item.checked ? "checked" : ""}`}>{item.text}</span>
      <button className="icon-btn del-btn" onClick={() => onDelete(item.id)}><XIcon size={13} /></button>
    </div>
  );
}

/* ============ 主程式 ============ */
function App() {
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [tripId, setTripId] = useState(null);
  const [tripStart, setTripStart] = useState("2026-09-16");
  const [tripEnd, setTripEnd] = useState("2026-09-24");
  const [items, setItems] = useState([]);
  const [flights, setFlights] = useState([]);
  const [hotels, setHotels] = useState([]);
  const [shopping, setShopping] = useState([]);

  const [showSetup, setShowSetup] = useState(false);
  const [section, setSection] = useState("itinerary");
  const [viewMode, setViewMode] = useState(window.innerWidth < 640 ? "mobile" : "desktop");
  const [activeDayIdx, setActiveDayIdx] = useState(0);
  const [editingId, setEditingId] = useState(null);
  const [dragItemId, setDragItemId] = useState(null);
  const inboxListRef = useRef(null);
  const dayListRef = useRef(null);

  useEffect(() => {
    if (!isMobileForDrag()) return;
    if (typeof Sortable === "undefined") return;
    const opts = {
      group: "mobile-itinerary",
      animation: 150,
      ghostClass: "drag-over",
      filter: ".sortable-ignore",
      preventOnFilter: true,
      onEnd: (evt) => {
        // Sortable 會直接搬動 DOM 節點，這裡先把它搬回原位，
        // 改成完全交給 React 依資料狀態重新渲染，避免兩邊打架造成畫面壞掉。
        if (evt.from && evt.item) {
          const referenceNode = evt.from.children[evt.oldIndex] || null;
          evt.from.insertBefore(evt.item, referenceNode);
        }
        const itemId = evt.item.getAttribute("data-item-id");
        const targetDay = evt.to.getAttribute("data-day") || null;
        if (itemId) assignDay(itemId, targetDay);
      },
    };
    const instances = [];
    if (inboxListRef.current) instances.push(Sortable.create(inboxListRef.current, opts));
    if (dayListRef.current) instances.push(Sortable.create(dayListRef.current, opts));
    return () => instances.forEach((s) => s.destroy());
  });
  function isMobileForDrag() {
    return viewMode === "mobile" && section === "itinerary";
  }

  useEffect(() => {
    (async () => {
      try {
        let { data: trips, error: tripErr } = await db.from("trips").select("*").order("created_at").limit(1);
        if (tripErr) throw tripErr;
        let trip;
        if (!trips || trips.length === 0) {
          const { data: created, error: createErr } = await db.from("trips").insert({ name: "我的旅程", start_date: tripStart, end_date: tripEnd }).select().single();
          if (createErr) throw createErr;
          trip = created;
        } else {
          trip = trips[0];
        }
        setTripId(trip.id);
        setTripStart(trip.start_date);
        setTripEnd(trip.end_date);

        const [itemsRes, flightsRes, hotelsRes, shopRes] = await Promise.all([
          db.from("itinerary_items").select("*").eq("trip_id", trip.id),
          db.from("flights").select("*").eq("trip_id", trip.id),
          db.from("hotels").select("*").eq("trip_id", trip.id),
          db.from("shopping_items").select("*").eq("trip_id", trip.id),
        ]);
        if (itemsRes.error) throw itemsRes.error;
        if (flightsRes.error) throw flightsRes.error;
        if (hotelsRes.error) throw hotelsRes.error;
        if (shopRes.error) throw shopRes.error;

        setItems(itemsRes.data.map(itemFromDb));
        setFlights(flightsRes.data.map(flightFromDb));
        setHotels(hotelsRes.data.map(hotelFromDb));
        setShopping(shopRes.data);
        setLoading(false);
      } catch (e) {
        setLoadError(e);
        setLoading(false);
      }
    })();
  }, []);

  const days = useMemo(() => buildDays(tripStart, tripEnd), [tripStart, tripEnd]);
  const itemsForDay = (dayKey) => items.filter((it) => it.day === dayKey);
  const inboxItems = items.filter((it) => !it.day);

  const autoItemsForDay = (dayKey) => {
    const timed = [];
    const nightly = [];
    flights.forEach((f) => {
      if (f.date === dayKey) {
        timed.push({ id: `auto-fl-${f.id}`, kind: "flight", tagLabel: f.note || "航班", time: f.time || "", name: `${f.from || "?"} → ${f.to || "?"}${f.flightNo ? `（${f.flightNo}）` : ""}`, note: f.terminal ? `航廈 ${f.terminal}` : "", mapQuery: null, onDelete: () => handleFlightDelete(f.id), onEdit: () => { setSection("logistics"); setEditingId(f.id); } });
      }
    });
    hotels.forEach((h) => {
      if (h.checkin === dayKey) timed.push({ id: `auto-ht-in-${h.id}`, kind: "hotel", tagLabel: "入住", time: h.checkinTime || "", name: h.name || "（未命名飯店）", note: h.address, mapQuery: h.address || h.name, onDelete: () => handleHotelDelete(h.id), onEdit: () => { setSection("logistics"); setEditingId(h.id); } });
      if (h.checkout === dayKey) timed.push({ id: `auto-ht-out-${h.id}`, kind: "hotel", tagLabel: "退房", time: h.checkoutTime || "", name: h.name || "（未命名飯店）", note: h.address, mapQuery: h.address || h.name, onDelete: () => handleHotelDelete(h.id), onEdit: () => { setSection("logistics"); setEditingId(h.id); } });
      if (nightsBetween(h.checkin, h.checkout).includes(dayKey)) nightly.push(h);
    });
    return { timed, nightly };
  };

  const getDayCards = (dayKey) => {
    const { timed: autoTimed, nightly } = autoItemsForDay(dayKey);
    const manual = itemsForDay(dayKey).map((it) => ({ ...it, __manual: true }));
    const combined = [...autoTimed, ...manual];
    combined.sort((a, b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
    return { timed: combined, nightly };
  };

  const handleMapClick = (name) => window.open(mapsUrl(name), "_blank");

  /* ---- 行程項目 CRUD ---- */
  const handleDragStart = (e, id) => { setDragItemId(id); e.dataTransfer.effectAllowed = "move"; };
  const handleDragEnd = () => setDragItemId(null);
  const handleDropOnDay = async (e, dayKey) => {
    e.preventDefault();
    const id = dragItemId;
    if (!id) return;
    await assignDay(id, dayKey);
  };
  const assignDay = async (id, dayKey) => {
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, day: dayKey } : it)));
    await db.from("itinerary_items").update({ day: dayKey }).eq("id", id);
  };
  const handleAdd = async (dayKey, name) => {
    const { data, error } = await db.from("itinerary_items").insert({ trip_id: tripId, day: dayKey, time: "", name, note: "" }).select().single();
    if (!error) setItems((prev) => [...prev, itemFromDb(data)]);
  };
  const handleAddInbox = async (name) => {
    const { data, error } = await db.from("itinerary_items").insert({ trip_id: tripId, day: null, time: "", name, note: "" }).select().single();
    if (!error) setItems((prev) => [...prev, itemFromDb(data)]);
  };
  const handleDelete = async (id) => {
    setItems((prev) => prev.filter((it) => it.id !== id));
    await db.from("itinerary_items").delete().eq("id", id);
  };
  const handleEditSave = async (id, draft) => {
    setItems((prev) => prev.map((it) => (it.id === id ? { ...it, ...draft } : it)));
    setEditingId(null);
    await db.from("itinerary_items").update({ time: draft.time, name: draft.name, note: draft.note }).eq("id", id);
  };

  /* ---- 航班 CRUD ---- */
  const handleAddFlight = async () => {
    const { data, error } = await db.from("flights").insert({ trip_id: tripId, date: tripStart, time: "", flight_no: "", from_code: "", to_code: "", terminal: "", note: "" }).select().single();
    if (!error) setFlights((prev) => [...prev, flightFromDb(data)]);
  };
  const handleFlightSave = async (id, draft) => {
    setFlights((prev) => prev.map((f) => (f.id === id ? draft : f)));
    setEditingId(null);
    await db.from("flights").update(flightToDb(draft)).eq("id", id);
  };
  const handleFlightDelete = async (id) => {
    setFlights((prev) => prev.filter((f) => f.id !== id));
    await db.from("flights").delete().eq("id", id);
  };

  /* ---- 飯店 CRUD ---- */
  const handleAddHotel = async () => {
    const { data, error } = await db.from("hotels").insert({ trip_id: tripId, name: "", address: "", checkin: tripStart, checkin_time: "15:00", checkout: tripEnd, checkout_time: "11:00", confirmation: "" }).select().single();
    if (!error) setHotels((prev) => [...prev, hotelFromDb(data)]);
  };
  const handleHotelSave = async (id, draft) => {
    setHotels((prev) => prev.map((h) => (h.id === id ? draft : h)));
    setEditingId(null);
    await db.from("hotels").update(hotelToDb(draft)).eq("id", id);
  };
  const handleHotelDelete = async (id) => {
    setHotels((prev) => prev.filter((h) => h.id !== id));
    await db.from("hotels").delete().eq("id", id);
  };

  /* ---- 購物清單 CRUD ---- */
  const handleAddShopping = async (text) => {
    const { data, error } = await db.from("shopping_items").insert({ trip_id: tripId, text, checked: false }).select().single();
    if (!error) setShopping((prev) => [...prev, data]);
  };
  const handleToggleShopping = async (id) => {
    const target = shopping.find((s) => s.id === id);
    if (!target) return;
    const next = !target.checked;
    setShopping((prev) => prev.map((s) => (s.id === id ? { ...s, checked: next } : s)));
    await db.from("shopping_items").update({ checked: next }).eq("id", id);
  };
  const handleDeleteShopping = async (id) => {
    setShopping((prev) => prev.filter((s) => s.id !== id));
    await db.from("shopping_items").delete().eq("id", id);
  };

  /* ---- 旅程日期 ---- */
  const handleTripStartChange = async (val) => {
    setTripStart(val);
    if (tripId) await db.from("trips").update({ start_date: val }).eq("id", tripId);
  };
  const handleTripEndChange = async (val) => {
    setTripEnd(val);
    if (tripId) await db.from("trips").update({ end_date: val }).eq("id", tripId);
  };

  if (loading) return <div className="loading-screen">讀取中…</div>;
  if (loadError) {
    return (
      <div className="error-screen">
        <div>
          <p>連線失敗，請確認 Supabase 網址／金鑰是否正確，或資料表是否已建立。</p>
          <pre>{String(loadError.message || loadError)}</pre>
        </div>
      </div>
    );
  }

  const activeDay = days[Math.min(activeDayIdx, Math.max(days.length - 1, 0))];
  const isMobile = viewMode === "mobile";
  const shoppingDone = shopping.filter((s) => s.checked).length;

  return (
    <div className="wrap">
      <div className="topbar">
        <div className="title">
          行程規劃
          <span className="sub">
            {tripStart.slice(5).replace("-", "/")}–{tripEnd.slice(5).replace("-", "/")}
            <button onClick={() => setShowSetup((s) => !s)}>編輯天數</button>
          </span>
        </div>
        <div className="toggle">
          <button className={!isMobile ? "active" : ""} onClick={() => setViewMode("desktop")}><Monitor size={13} /> 電腦版</button>
          <button className={isMobile ? "active" : ""} onClick={() => setViewMode("mobile")}><Smartphone size={13} /> 手機版</button>
        </div>
      </div>

      <div className="section-tabs">
        <button className={`section-tab ${section === "itinerary" ? "active" : ""}`} onClick={() => setSection("itinerary")}><ListChecks size={13} /> 行程</button>
        <button className={`section-tab ${section === "logistics" ? "active" : ""}`} onClick={() => setSection("logistics")}><Plane size={13} /> 航班・飯店</button>
        <button className={`section-tab ${section === "shopping" ? "active" : ""}`} onClick={() => setSection("shopping")}><ShoppingBag size={13} /> 購物清單</button>
      </div>

      {showSetup && section === "itinerary" && (
        <div className="setup-panel">
          <div className="setup-field"><label>出發日期</label><input type="date" value={tripStart} onChange={(e) => handleTripStartChange(e.target.value)} /></div>
          <div className="setup-field"><label>回程日期</label><input type="date" value={tripEnd} onChange={(e) => handleTripEndChange(e.target.value)} /></div>
          <button className="setup-close" onClick={() => setShowSetup(false)}>完成</button>
        </div>
      )}

      {section === "itinerary" && (
        <div
          className="inbox-shelf"
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => handleDropOnDay(e, null)}
        >
          <div className="inbox-label"><ListChecks size={13} /> 待排清單（還沒排定日期）</div>
          {inboxItems.length === 0 ? (
            <div className="inbox-empty">拖一張卡片到這裡，或用下面的新增功能加入還沒決定哪天去的地點</div>
          ) : (
            <div className="inbox-row" ref={inboxListRef} data-day="">
              {inboxItems.map((it) => (
                <div key={it.id} className="inbox-card-wrap" data-item-id={it.id}>
                  <ItemCard
                    item={it}
                    draggable={editingId !== it.id}
                    onDragStart={handleDragStart}
                    onDragEnd={handleDragEnd}
                    onMapClick={handleMapClick}
                    onDelete={handleDelete}
                    isEditing={editingId === it.id}
                    onEditStart={setEditingId}
                    onEditSave={handleEditSave}
                  />
                </div>
              ))}
            </div>
          )}
          <div style={{ marginTop: 8 }}>
            <AddInline onAdd={handleAddInbox} placeholder="新增到待排清單" />
          </div>
        </div>
      )}

      {section === "itinerary" && (
        !isMobile ? (
          <div className="desktop-grid">
            {days.map((d) => (
              <div key={d.key} className="day-col" onDragOver={(e) => e.preventDefault()} onDrop={(e) => handleDropOnDay(e, d.key)}>
                <div className="day-head"><span className="md">{d.md}</span><span className="wd">週{d.weekday}</span></div>
                <div className="day-body">
                  {getDayCards(d.key).timed.map((it) =>
                    it.__manual ? (
                      <div key={it.id} onDragOver={(e) => e.preventDefault()} onDrop={(e) => handleDropOnDay(e, d.key)}>
                        <ItemCard item={it} draggable={editingId !== it.id} onDragStart={handleDragStart} onDragEnd={handleDragEnd} onMapClick={handleMapClick} onDelete={handleDelete} isEditing={editingId === it.id} onEditStart={setEditingId} onEditSave={handleEditSave} />
                      </div>
                    ) : (
                      <AutoItemCard key={it.id} item={it} onMapClick={handleMapClick} />
                    )
                  )}
                  <AddInline onAdd={(name) => handleAdd(d.key, name)} />
                  {getDayCards(d.key).nightly.map((h) => <NightlyHotelStrip key={`night-${h.id}-${d.key}`} hotel={h} onMapClick={handleMapClick} />)}
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div className="mobile-wrap">
            <div className="day-tabs">
              {days.map((d, i) => (
                <div key={d.key} className={`day-tab ${i === activeDayIdx ? "active" : ""}`} onClick={() => setActiveDayIdx(i)}>
                  <div className="md">{d.md}</div><div className="wd">週{d.weekday}</div>
                </div>
              ))}
            </div>
            <div className="mobile-list" ref={dayListRef} data-day={activeDay ? activeDay.key : ""}>
              {activeDay && getDayCards(activeDay.key).timed.length === 0 && getDayCards(activeDay.key).nightly.length === 0 && <div className="empty-note sortable-ignore">這天還沒有安排行程</div>}
              {activeDay && getDayCards(activeDay.key).timed.map((it) =>
                it.__manual ? (
                  <div key={it.id} data-item-id={it.id}>
                    <ItemCard item={it} onMapClick={handleMapClick} onDelete={handleDelete} isEditing={editingId === it.id} onEditStart={setEditingId} onEditSave={handleEditSave} />
                  </div>
                ) : (
                  <div key={it.id} className="sortable-ignore"><AutoItemCard item={it} onMapClick={handleMapClick} /></div>
                )
              )}
              {activeDay && <div className="sortable-ignore"><AddInline onAdd={(name) => handleAdd(activeDay.key, name)} /></div>}
              {activeDay && getDayCards(activeDay.key).nightly.map((h) => <div key={`night-${h.id}-${activeDay.key}`} className="sortable-ignore"><NightlyHotelStrip hotel={h} onMapClick={handleMapClick} /></div>)}
            </div>
          </div>
        )
      )}

      {section === "logistics" && (
        <div className={isMobile ? "mobile-wrap" : ""}>
          <div className="logi-section">
            <div>
              <div className="logi-group-label">航班</div>
              <div className="logi-list">
                {flights.map((f) => <FlightCard key={f.id} flight={f} isEditing={editingId === f.id} onEditStart={setEditingId} onEditSave={handleFlightSave} onDelete={handleFlightDelete} />)}
                <button className="logi-add" onClick={handleAddFlight}><Plus size={13} /> 新增航班</button>
              </div>
            </div>
            <div>
              <div className="logi-group-label">飯店</div>
              <div className="logi-list">
                {hotels.map((h) => <HotelCard key={h.id} hotel={h} isEditing={editingId === h.id} onEditStart={setEditingId} onEditSave={handleHotelSave} onDelete={handleHotelDelete} onMapClick={handleMapClick} />)}
                <button className="logi-add" onClick={handleAddHotel}><Plus size={13} /> 新增飯店</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {section === "shopping" && (
        <div className={isMobile ? "mobile-wrap" : "shop-section"}>
          <div className="shop-progress">已完成 {shoppingDone} / {shopping.length}</div>
          <div className="shop-list">{shopping.map((s) => <ShoppingRow key={s.id} item={s} onToggle={handleToggleShopping} onDelete={handleDeleteShopping} />)}</div>
          <AddInline onAdd={handleAddShopping} placeholder="新增購物項目" />
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  (function () {
    var src = document.getElementById("app-source").textContent;
    var output = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
      filename: "app.jsx",
    }).code;
    var s = document.createElement("script");
    s.textContent = output;
